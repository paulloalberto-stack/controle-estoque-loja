function calcDesconto(sub, desc, tipo) { const d = tipo === 'P' ? sub * num(desc) / 100 : num(desc); return r2(Math.min(Math.max(d, 0), sub)); }

function agrupa(lista, chave, val) { const m = new Map(); lista.forEach(x => { const k = chave(x); const a = m.get(k) || { k, n: 0, q: 0, v: 0, c: 0 }; val(a, x); m.set(k, a); }); return [...m.values()]; }

  if (n === 1) return imprimir(docAtual(''), 'A4');
  // duas vias por folha A4; a 3ª e a 4ª vão numa segunda folha
  const folhas = []; for (let i = 0; i < n; i += 2) folhas.push(nomes.slice(i, i + 2));
  imprimir(folhas.map((f, k) => `<div class="duas${k ? ' pg-quebra' : ''}">${f.map(v => `<div class="meia"><div class="meia-in">${docAtual(v)}</div></div>`).join('<div class="corte"></div>')}</div>`).join(''), 'A4', ajustarMeias);

/* as duas vias na mesma folha A4: uma em cima da outra (retrato) ou lado a lado (paisagem),
   o que deixar a letra maior; se ainda não couber, a via é reduzida proporcionalmente */
function ajustarMeias() {
  const pr = $('#print'), duas = $$('#print .duas');
  pr.style.cssText = 'display:block;position:absolute;left:-10000px;top:0;width:281mm';
  const r = document.createElement('div'); r.style.height = '100mm'; pr.appendChild(r); const px = r.offsetHeight / 100; r.remove();
  const escala = (el, larg, alt) => {
    let z = 1;
    for (let i = 0; i < 6; i++) { el.style.width = (larg / z) + 'mm'; const n = Math.min(1, alt * px / el.offsetHeight); if (Math.abs(n - z) < 0.005) { z = n; break; } z = n; }
    el.style.width = (larg / z) + 'mm';
    return Math.min(z, alt * px / el.offsetHeight);
  };
  const vias = $$('#print .meia-in');
  const zRet = Math.min(...vias.map(el => escala(el, 194, 135)));
  const zPai = Math.min(...vias.map(el => escala(el, 136, 192)));
  const lado = zPai > zRet + 0.05;
  duas.forEach(x => x.classList.toggle('lado', lado));
  $('#pg').textContent = lado ? '@page{size:A4 landscape;margin:8mm}' : PAGINA.A4;
  vias.forEach(el => { const z = lado ? escala(el, 136, 192) : escala(el, 194, 135); el.style.transform = z < 0.999 ? `scale(${z})` : ''; });
  pr.style.cssText = '';
}

function totalVenda() { const sub = r2(carrinho.venda.reduce((s, i) => s + i.qtd * i.valor, 0)); return r2(sub - calcDesconto(sub, form.venda.desc, form.venda.desct)); }

function validarPags(pags, total, cl, parc, venc1) {

  if (r.falta) { aviso(`Falta receber ${fmtR(r.falta)}.`, 'erro'); return null; }
  const din = r2(r.linhas.filter(x => x.forma === 'Dinheiro').reduce((s, x) => s + x.valor, 0));

const soDig = s => String(s || '').replace(/\D/g, '');
/* ===== Máscaras, CPF/CNPJ e busca de CEP ===== */
function mascara(tipo, v) {
  let d = soDig(v);
  if (tipo === 'tel') {
    d = d.slice(0, 11);
    if (d.length <= 2) return d.length ? '(' + d : '';
    if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
    if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
    return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  }
  if (tipo === 'cep') { d = d.slice(0, 8); return d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d; }
  if (tipo === 'doc' || tipo === 'cpf' || tipo === 'cnpj') {
    d = d.slice(0, tipo === 'cpf' ? 11 : 14);
    const p = (d.length <= 11 && tipo !== 'cnpj') ? [[3, '.'], [6, '.'], [9, '-']] : [[2, '.'], [5, '.'], [8, '/'], [12, '-']];
    let s = '';
    for (let i = 0; i < d.length; i++) { const m = p.find(x => x[0] === i); s += (m ? m[1] : '') + d[i]; }
    return s;
  }
  return v;
}
const repetido = c => c.split('').every(x => x === c[0]);
function cpfOk(v) {
  const c = soDig(v); if (c.length !== 11 || repetido(c)) return false;
  for (let t = 9; t < 11; t++) { let s = 0; for (let i = 0; i < t; i++) s += +c[i] * (t + 1 - i); if (((s * 10) % 11) % 10 !== +c[t]) return false; }
  return true;
}
function cnpjOk(v) {
  const c = soDig(v); if (c.length !== 14 || repetido(c)) return false;
  const dv = n => { let s = 0, p = n - 7; for (let i = 0; i < n; i++) { s += +c[i] * p--; if (p < 2) p = 9; } const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return dv(12) === +c[12] && dv(13) === +c[13];
}
const docOk = v => { const n = soDig(v).length; return n === 11 ? cpfOk(v) : n === 14 ? cnpjOk(v) : false; };
const telOk = v => { const n = soDig(v).length; return n === 10 || n === 11; };
// mensagem de erro (ou '') para o campo; vazio é aceito
function erroCampo(tipo, v) {
  if (!soDig(v)) return '';
  if (tipo === 'tel') return telOk(v) ? '' : 'Telefone deve ter DDD + número (10 ou 11 dígitos).';
  if (tipo === 'cep') return soDig(v).length === 8 ? '' : 'CEP deve ter 8 números.';
  if (tipo === 'cpf') return cpfOk(v) ? '' : 'CPF inválido. Confira os números.';
  if (tipo === 'cnpj') return cnpjOk(v) ? '' : 'CNPJ inválido. Confira os números.';
  if (tipo === 'doc') { const n = soDig(v).length; return docOk(v) ? '' : n === 11 ? 'CPF inválido. Confira os números.' : n === 14 ? 'CNPJ inválido. Confira os números.' : 'CPF tem 11 números e CNPJ tem 14.'; }
  return '';
}
// confere todos os campos com máscara dentro de um bloco; devolve true se estiver tudo certo
function conferirCampos(raiz) {
  let erro = '';
  $$(raiz + ' [data-mask]').forEach(el => {
    const m = erroCampo(el.dataset.mask, el.value); el.classList.toggle('invalido', !!m);
    if (m && !erro) {
      // abre a aba das Configurações onde está o campo e diz qual é
      const pane = el.closest('.cfg-pane'); if (pane && !pane.classList.contains('on')) ACT.cfgAba({ dataset: { v: pane.dataset.aba } });
      const lab = el.closest('label'), nome = lab ? lab.firstChild.textContent.trim() : '';
      erro = (nome ? nome + ': ' : '') + m; el.focus(); try { el.scrollIntoView({ block: 'center' }); } catch (e) { }
    }
  });
  if (erro) aviso(erro, 'erro');
  return !erro;
}
function aplicarMascara(el, e) {
  const t = el.dataset.mask;
  if (!(e.type === 'input' && e.inputType && e.inputType.indexOf('delete') === 0)) { const v = mascara(t, el.value); if (v !== el.value) el.value = v; }
  if (e.type === 'change') { const m = erroCampo(t, el.value); el.classList.toggle('invalido', !!m); el.title = m; if (m) aviso(m, 'erro'); }
  else if (el.classList.contains('invalido') && !erroCampo(t, el.value)) { el.classList.remove('invalido'); el.title = ''; }
  if (t === 'cep' && el.dataset.rua && soDig(el.value).length === 8 && el.dataset.ult !== soDig(el.value)) cepAuto(el);
}
async function buscarCep(cep) {
  const d = soDig(cep);
  try {
    const r = await fetch(`https://viacep.com.br/ws/${d}/json/`), j = await r.json();
    if (j.erro) throw new Error('nao');
    return { rua: j.logradouro, bairro: j.bairro, cidade: j.localidade, uf: j.uf };
  } catch (e) {
    try {
      const r = await fetch(`https://brasilapi.com.br/api/cep/v1/${d}`); if (!r.ok) throw new Error('nao');
      const j = await r.json(); return { rua: j.street, bairro: j.neighborhood, cidade: j.city, uf: j.state };
    } catch (e2) { throw new Error(navigator.onLine === false ? 'Sem internet para buscar o CEP: preencha o endereço à mão.' : 'CEP não encontrado. Confira o número ou preencha o endereço à mão.'); }
  }
}
async function cepAuto(el) {
  const d = soDig(el.value); el.dataset.ult = d; el.classList.add('buscando');
  try {
    const r = await buscarCep(d), por = k => document.getElementById(el.dataset[k]);
    if (soDig(el.value) !== d) return;
    if (r.rua && por('rua')) por('rua').value = r.rua + (el.dataset.num ? '' : ', ');

    const f = r.rua ? (por('num') || por('rua')) : por('rua');

    if ($('#cfg-prev')) previaCfg();
    aviso(`CEP ${mascara('cep', d)}: ${r.rua ? r.rua + ', ' : ''}${r.cidade}/${r.uf}`, 'ok');
  } catch (er) { el.dataset.ult = ''; aviso(er.message, 'erro'); }
  finally { el.classList.remove('buscando'); }
}

const LF = String.fromCharCode(10), CR = String.fromCharCode(13);

/* ===== Fotos dos produtos =====
   Uma foto por modelo (vale para todos os tamanhos), reduzida para ~600 px em JPEG (~50-80 KB) + miniatura de 120 px.
   Ficam num banco separado (lojaRoupasFotos), fora dos dados: salvar uma venda não regrava as fotos. */
let fotoMini = {}, fotoTemp, fotoAlvo = null, camStream = null;
function idbFotos() {
  return new Promise((ok, er) => { const r = indexedDB.open('lojaRoupasFotos', 1); r.onupgradeneeded = () => r.result.createObjectStore('fotos'); r.onsuccess = () => ok(r.result); r.onerror = () => er(r.error); });
}
async function fotosOp(modo, fn) {
  const b = await idbFotos();
  return new Promise((ok, er) => { const t = b.transaction('fotos', modo), st = t.objectStore('fotos'); let res; const r = fn(st); if (r) r.onsuccess = () => { res = r.result; }; t.oncomplete = () => { b.close(); ok(res); }; t.onerror = () => { b.close(); er(t.error); }; });
}
const fotoGravar = (id, f) => fotosOp('readwrite', st => st.put({ img: f.img, mini: f.mini, quando: agora() }, id));
const fotoLer = id => fotosOp('readonly', st => st.get(id));
async function fotosTodas() {
  const out = {};
  await fotosOp('readonly', st => { const c = st.openCursor(); c.onsuccess = () => { const k = c.result; if (k) { out[k.key] = { img: k.value.img, mini: k.value.mini }; k.continue(); } }; });
  return out;
}
async function carregarMinis() {
  try { const t = await fotosTodas(); fotoMini = {}; for (const k in t) fotoMini[k] = t[k].mini; } catch (e) { fotoMini = {}; }
}
async function limparFotosOrfas() {
  const usadas = new Set(db.produtos.map(p => p.foto).filter(Boolean));
  const ids = await fotosOp('readonly', st => st.getAllKeys());
  const sobra = (ids || []).filter(id => !usadas.has(id));
  if (sobra.length) await fotosOp('readwrite', st => { sobra.forEach(id => { st.delete(id); delete fotoMini[id]; }); });
  return sobra.length;
}
async function restaurarFotos(fotos) {
  await fotosOp('readwrite', st => { for (const id in fotos) if (fotos[id] && fotos[id].img) st.put({ img: fotos[id].img, mini: fotos[id].mini || fotos[id].img, quando: agora() }, id); });
  await carregarMinis(); render();
}
// texto do arquivo de backup: dados + fotos (se a opção estiver ligada)
async function textoComFotos(txt) {
  if (cfgBk().fotos !== false && db.produtos.some(p => p.foto)) { const f = await fotosTodas(); if (Object.keys(f).length) txt = txt.slice(0, -1) + ',"_fotos":' + JSON.stringify(f) + '}'; }
  if (cfgBk().logs !== false) { try { const l = await logTodos(); if (l.length) txt = txt.slice(0, -1) + ',"_logs":' + JSON.stringify(l) + '}'; } catch (e) { } }
  return txt;
}
const chaveModelo = p => [p.tipo, p.descricao, p.marca, p.cor || ''].join('|').toLowerCase();
const miniHTML = p => p && p.foto && fotoMini[p.foto] ? `<img class="mini" src="${fotoMini[p.foto]}" alt="">` : '<span class="mini mini-vazia" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><polyline points="21 16 15 11 5 19"/></svg></span>';
// aplica a foto (ou remove, com null) em todos os tamanhos do mesmo modelo
async function aplicarFoto(produtos, foto) {
  const alvo = new Set(); produtos.forEach(p => db.produtos.forEach(x => { if (chaveModelo(x) === chaveModelo(p)) alvo.add(x); }));
  if (foto) { const id = 'F' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); await fotoGravar(id, foto); fotoMini[id] = foto.mini; alvo.forEach(x => { x.foto = id; }); }
  else alvo.forEach(x => { delete x.foto; });
  registrar(foto ? 'Foto do produto alterada' : 'Foto do produto removida', [...alvo].map(x => x.codigo).slice(0, 6).join(', '));
  salvar(); limparFotosOrfas().catch(() => { });
  return alvo.size;
}
function processarImagem(src) {
  return new Promise((ok, er) => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
      const m = document.createElement('canvas'), lado = Math.min(im.width, im.height); m.width = m.height = 120;
      const gm = m.getContext('2d'); gm.fillStyle = '#fff'; gm.fillRect(0, 0, 120, 120); gm.drawImage(im, (im.width - lado) / 2, (im.height - lado) / 2, lado, lado, 0, 0, 120, 120);
      ok({ img: c.toDataURL('image/jpeg', 0.82), mini: m.toDataURL('image/jpeg', 0.75) });
    };
    im.onerror = () => er(new Error('Não foi possível ler esta imagem. Use JPG ou PNG (foto de iPhone em HEIC precisa ser convertida).'));
    im.src = src;
  });
}
function blocoFoto(fotoId) {

}
async function usarFoto(foto) {
  if (fotoAlvo === 'form') { fotoTemp = foto; $('#foto-prev').innerHTML = foto ? `<img src="${foto.mini}" alt="">` : miniHTML(null); return; }
  const p = prod(fotoAlvo); if (!p) return;

function pararCamera() { if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
ACT.camAbrir = async () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return aviso('Este computador não oferece câmera para o navegador.', 'erro');
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });

  } catch (e) { aviso('Não foi possível usar a câmera (' + (e.name === 'NotAllowedError' ? 'permissão negada' : e.name === 'NotFoundError' ? 'nenhuma câmera encontrada' : e.message) + ').', 'erro'); }
};

ACT.verFoto = async el => {

    <div class="foto-info"><div class="pix-valor">${fmtR(p.preco)}</div><small class="mut">${esc(p.codigo)}${p.colecao ? ' · ' + esc(p.colecao) : ''}</small>
    <div class="foto-tams">${tams.map(x => `<span class="${x.id === p.id ? 'on' : ''}${x.estoque <= 0 ? ' zero' : ''}" title="estoque ${x.estoque}">${esc(x.tamanho)}<small>${x.estoque}</small></span>`).join('')}</div><small class="mut">Tamanhos e estoque deste modelo.</small></div></div>

/* ===== Relatórios de estoque: sintético e analítico, com PDF e Excel ===== */
const REL_MODO_PADRAO = { grade: 'analitico', merc: 'sintetico', marca: 'sintetico', faixa: 'sintetico' };
const modoRel = k => { filtros.rel.modo = filtros.rel.modo || Object.assign({}, REL_MODO_PADRAO); return filtros.rel.modo[k]; };
const totaisEst = l => ({ m: new Set(l.map(chaveModelo)).size, n: l.length, q: l.reduce((s, p) => s + p.estoque, 0), c: l.reduce((s, p) => s + p.estoque * (p.custo || 0), 0), v: l.reduce((s, p) => s + p.estoque * p.preco, 0) });
function agrupar(l, f) { const m = new Map(); l.forEach(x => { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; }
const merc = p => `${p.tipo} ${p.descricao}`;
const ordTipoDesc = (a, b) => TIPOS.indexOf(a[1][0].tipo) - TIPOS.indexOf(b[1][0].tipo) || a[0].localeCompare(b[0]);
const pct = (q, t) => t ? q / t : 0;
const C = (t, f) => ({ t, f });
// tipo e tamanho
function relGrade(modo) {
  const at = ativos(), tg = totaisEst(at), r = { titulo: 'Estoque por tipo e tamanho', sub: 'Peças em estoque por mercadoria (tipo + descrição) e tamanho', secoes: [] };
  if (modo === 'sintetico') {
    const g = [...agrupar(at, p => p.tipo)].sort((a, b) => TIPOS.indexOf(a[0]) - TIPOS.indexOf(b[0]));
    r.secoes.push({ cols: [C('Tipo', 's'), C('Modelos', 'i'), C('Peças', 'i'), C('% das peças', 'p'), C('Custo', 'r'), C('Venda', 'r')],
      linhas: g.map(([k, l]) => { const t = totaisEst(l); return { c: [k, t.m, t.q, pct(t.q, tg.q), t.c, t.v] }; }).concat([{ k: 'tot', c: ['Total geral', tg.m, tg.q, 1, tg.c, tg.v] }]) });
    return r;
  }
  [...agrupar(at, p => p.tipo)].sort((a, b) => TIPOS.indexOf(a[0]) - TIPOS.indexOf(b[0])).forEach(([tipo, l]) => {
    const tams = [...new Set(l.map(p => p.tamanho))].sort((a, b) => ordTam(a) - ordTam(b) || String(a).localeCompare(b));
    const linha = (rot, ll, k) => { const t = totaisEst(ll); return { k, c: [rot].concat(tams.map(tm => ll.filter(p => p.tamanho === tm).reduce((s, p) => s + p.estoque, 0)), [t.q, t.v]) }; };
    r.secoes.push({ titulo: tipo, cols: [C('Mercadoria', 's')].concat(tams.map(t => C(t, 'i')), [C('Total', 'i'), C('Venda', 'r')]),
      linhas: [...agrupar(l, merc)].sort((a, b) => a[0].localeCompare(b[0])).map(([k, ll]) => linha(k, ll)).concat([linha('Total ' + tipo, l, 'tot')]) });
  });
  r.secoes.push({ titulo: 'Resumo', cols: [C('', 's'), C('Modelos', 'i'), C('Peças', 'i'), C('Custo', 'r'), C('Venda', 'r')], linhas: [{ k: 'tot', c: ['Total geral', tg.m, tg.q, tg.c, tg.v] }] });
  return r;
}
// por mercadoria (tipo + descrição); analítico abre por marca e cor
function relMerc(modo) {
  const at = ativos(), tg = totaisEst(at), g = [...agrupar(at, merc)].sort(ordTipoDesc);
  const cols = [C(modo === 'sintetico' ? 'Mercadoria' : 'Mercadoria / marca e cor', 's'), C('Modelos', 'i'), C('Peças', 'i'), C('% das peças', 'p'), C('Custo', 'r'), C('Venda', 'r')];
  const lin = (rot, l, k) => { const t = totaisEst(l); return { k, c: [rot, t.m, t.q, pct(t.q, tg.q), t.c, t.v] }; };
  let linhas = [];
  if (modo === 'sintetico') linhas = g.map(([k, l]) => lin(k, l));
  else g.forEach(([k, l]) => { linhas.push(lin(k, l, 'grp')); [...agrupar(l, p => p.marca + (p.cor ? ' – ' + p.cor : ''))].sort((a, b) => a[0].localeCompare(b[0])).forEach(([m, ll]) => linhas.push(lin('   ' + m, ll))); });
  return { titulo: 'Estoque por mercadoria', sub: 'Tipo + descrição (ex.: Camisa Manga curta)', secoes: [{ cols, linhas: linhas.concat([lin('Total geral', at, 'tot')]) }] };
}
// por marca; analítico abre por mercadoria
function relMarca(modo) {
  const at = ativos(), tg = totaisEst(at), g = [...agrupar(at, p => p.marca)].sort((a, b) => a[0].localeCompare(b[0]));
  const cols = [C(modo === 'sintetico' ? 'Marca' : 'Marca / mercadoria', 's'), C('Modelos', 'i'), C('Peças', 'i'), C('% das peças', 'p'), C('Custo', 'r'), C('Venda', 'r')];
  const lin = (rot, l, k) => { const t = totaisEst(l); return { k, c: [rot, t.m, t.q, pct(t.q, tg.q), t.c, t.v] }; };
  let linhas = [];
  if (modo === 'sintetico') linhas = g.map(([k, l]) => lin(k, l));
  else g.forEach(([k, l]) => { linhas.push(lin(k, l, 'grp')); [...agrupar(l, merc)].sort(ordTipoDesc).forEach(([m, ll]) => linhas.push(lin('   ' + m, ll))); });
  return { titulo: 'Estoque por marca', sub: modo === 'sintetico' ? 'Totais por marca' : 'Cada marca aberta por mercadoria (Lacoste – Camisa Manga longa, Bermuda…)', secoes: [{ cols, linhas: linhas.concat([lin('Total geral', at, 'tot')]) }] };
}
// por faixa de preço; analítico abre por mercadoria
function relFaixa(modo) {
  const at = ativos(), tg = totaisEst(at);
  const cols = [C(modo === 'sintetico' ? 'Faixa de preço' : 'Faixa / mercadoria', 's'), C('Produtos', 'i'), C('Peças', 'i'), C('% das peças', 'p'), C('Custo', 'r'), C('Venda', 'r')];
  const lin = (rot, l, k) => { const t = totaisEst(l); return { k, c: [rot, t.n, t.q, pct(t.q, tg.q), t.c, t.v] }; };
  let linhas = [];
  FAIXAS.forEach(x => {
    const l = at.filter(p => p.preco >= x[0] && p.preco < x[1]);
    if (modo === 'sintetico') return linhas.push(lin(x[2], l));
    if (!l.length) return;
    linhas.push(lin(x[2], l, 'grp')); [...agrupar(l, merc)].sort(ordTipoDesc).forEach(([m, ll]) => linhas.push(lin('   ' + m, ll)));
  });
  return { titulo: 'Estoque por faixa de preço', sub: 'Pelo preço de venda de cada produto', secoes: [{ cols, linhas: linhas.concat([lin('Total geral', at, 'tot')]) }] };
}
const REL_EST = { grade: relGrade, merc: relMerc, marca: relMarca, faixa: relFaixa };

  db.trocas.forEach(t => { if (desde && t.data.slice(0, 10) < desde) return; t.itens.forEach(i => { const a = g(i.prod); a.q -= i.qtd; a.v -= i.qtd * i.preco; }); });
  return m;
}

/* ===== Importação do XML da NF-e do fornecedor ===== */
function lerXmlNfe(txt) {
  const x = new DOMParser().parseFromString(txt, 'text/xml');
  if (x.getElementsByTagName('parsererror').length) return null;
  const t = (el, tag) => { const n = el && el.getElementsByTagName(tag)[0]; return n ? n.textContent.trim() : ''; };
  const emit = x.getElementsByTagName('emit')[0], ide = x.getElementsByTagName('ide')[0], dets = Array.from(x.getElementsByTagName('det'));
  if (!emit || !dets.length) return null;

    forn: t(emit, 'xFant') || t(emit, 'xNome'), razao: t(emit, 'xNome'), cnpj: t(emit, 'CNPJ') || t(emit, 'CPF'), nf: t(ide, 'nNF'),
    itens: dets.map(dd => { const p = dd.getElementsByTagName('prod')[0]; return { cProd: t(p, 'cProd'), ean: gtin(t(p, 'cEAN')) || gtin(t(p, 'cEANTrib')), xProd: t(p, 'xProd'), un: t(p, 'uCom'), q: parseFloat(t(p, 'qCom')) || 0, vUn: parseFloat(t(p, 'vUnCom')) || 0 }; }),
    dups: Array.from(x.getElementsByTagName('dup')).map(dd => ({ n: t(dd, 'nDup'), venc: t(dd, 'dVenc'), valor: parseFloat(t(dd, 'vDup')) || 0 }))
  };
}
function adivinhaTipo(s) { s = s.toUpperCase(); return /CAL[CÇ]A|JEANS|SARJA/.test(s) && !/BERM/.test(s) ? 'Calça' : /BERM|SHORT/.test(s) ? 'Bermuda' : /CAMISETA|T-SHIRT|TSHIRT|REGATA/.test(s) ? 'Camiseta' : /POLO/.test(s) && !/RALPH|LAUREN/.test(s) ? 'Polo' : 'Camisa'; }
function limpaDesc(s, tam) {
  let w = s.trim().split(/\s+/);
  if (w.length > 1 && /^(CAL[CÇ]A|CAMISA|BERMUDA)$/i.test(w[0])) w.shift();
  if (w.length > 1 && w[w.length - 1].toUpperCase() === String(tam).toUpperCase()) w.pop();

/* criptografia dos arquivos de backup (AES-256-GCM, chave derivada da senha do backup) */
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(s); };
const deb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function chaveDeSenha(senha, sal, iter) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: sal, iterations: iter }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function cifrar(txt, chave, sal, iter) {
  const iv = crypto.getRandomValues(new Uint8Array(12)), c = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, chave, new TextEncoder().encode(txt)));
  return JSON.stringify({ formato: 'lojaRoupas-cripto', v: 1, alg: 'AES-256-GCM / PBKDF2-SHA256', iter, sal: b64(sal), iv: b64(iv), dados: b64(c) });
}
async function decifrar(obj, senha) {
  const chave = await chaveDeSenha(senha, deb64(obj.sal), obj.iter);

}

}

  const rc = repet(db.produtos, p => p.codigo && p.codigo.toUpperCase()); if (rc.length) prob.push('Códigos repetidos: ' + rc.slice(0, 5).join(', '));
  const rb = repet(db.produtos.filter(p => p.ativo !== false), p => p.barras); if (rb.length) prob.push('Códigos de barras repetidos: ' + rb.slice(0, 5).join(', '));
  const semProd = db.vendas.filter(v => v.itens.some(i => !prod(i.prod))).length; if (semProd) prob.push(`${semProd} venda(s) com produto que não existe mais (só histórico, não afeta o estoque).`);
  let corrigidos = 0;
  [['prod', 'produtos'], ['ent', 'entradas'], ['venda', 'vendas'], ['cond', 'condicionais'], ['mov', 'movs'], ['usu', 'usuarios'], ['cli', 'clientes'], ['cred', 'creditos'], ['troca', 'trocas'], ['rec', 'receber'], ['pag', 'pagar']].forEach(([s, k]) => {

      if (!meta[2] && meta[0] !== 'Navegação') { _registrarBase(meta[1], txt.slice(0, 300)); salvar(); }
    };
    const r = f(el); if (r && typeof r.then === 'function') return r.then(x => { fim(); return x; }); fim(); return r;
  };
});

/* tela Histórico de logs */
const CATS_LOG = ['Acesso', 'Vendas', 'Condicionais', 'Trocas', 'Clientes', 'Estoque', 'Financeiro', 'Comissões', 'Usuários', 'Configurações', 'Backup e dados', 'Documentos', 'Consultas', 'Navegação', 'Sistema', 'Outros'];
function logs() {
  const f = filtros.log; if (!f.de) { f.de = somaDias(-6); f.ate = hoje(); }
  setTimeout(carregarLogs);
  return `${cabTela('Histórico de logs')}
  <section class="card"><div class="filtros">
    <label>De<input type="date" data-filtro="log.de" value="${f.de}"></label><label>Até<input type="date" data-filtro="log.ate" value="${f.ate}"></label>
    <label>Usuário<select data-filtro="log.u" id="lg-filtro-u"><option value="">Todos</option></select></label>
    <label>Tipo<select data-filtro="log.cat"><option value="">Tudo</option>${CATS_LOG.map(c => `<option ${c === f.cat ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
    <label class="chk" style="align-self:end"><input type="checkbox" data-filtro="log.nav" ${f.nav === 'sim' ? 'checked' : ''} value="sim"> Mostrar telas abertas e consultas</label>
    <label class="lg">Buscar<input data-filtro="log.busca" value="${esc(f.busca)}" placeholder="venda nº, cliente, produto, valor…"></label>
    <span style="flex:1"></span><button class="btn" data-act="logCsv">Exportar CSV</button><button class="btn" data-act="logXlsx">Excel</button></div>
    <div id="tb-log"><p class="mut">Carregando…</p></div>
    <p class="mut">Tudo o que cada pessoa faz fica gravado aqui, neste computador, e vai junto no arquivo de backup. Ninguém consegue apagar o histórico pelo sistema.</p></section>`;
}
function logsFiltrados() {
  const f = filtros.log, b = (f.busca || '').toLowerCase();
  return (logsCache || []).filter(l => {
    const d = l.q.slice(0, 10);
    if (f.de && d < f.de) return false; if (f.ate && d > f.ate) return false;
    if (f.u && l.u !== f.u) return false; if (f.cat && l.cat !== f.cat) return false;
    if (!f.cat && f.nav !== 'sim' && (l.cat === 'Navegação' || l.cat === 'Consultas')) return false;
    if (b && [l.u, l.cat, l.ev, l.det, l.tela].join(' ').toLowerCase().indexOf(b) < 0) return false;
    return true;
  }).sort((a, b2) => b2.ts - a.ts);
}
async function carregarLogs() {
  if (!$('#tb-log')) return;
  if (!logsCache) { try { logsCache = await logTodos(); } catch (e) { logsCache = []; } }
  const sel = $('#lg-filtro-u'); if (sel && sel.options.length <= 1) [...new Set(logsCache.map(l => l.u))].sort().forEach(u => sel.insertAdjacentHTML('beforeend', `<option ${u === filtros.log.u ? 'selected' : ''}>${esc(u)}</option>`));
  tabelaLogs();
}
function tabelaLogs() {
  const el = $('#tb-log'); if (!el) return;
  const l = logsFiltrados(), por = agrupa(l, x => x.u, (a) => { a.n++; }).sort((a, b) => b.n - a.n);
  el.innerHTML = `<div class="log-resumo"><b>${fmtN(l.length)}</b> registro(s) no filtro ${por.length ? '· ' + por.slice(0, 8).map(a => `${esc(a.k)}: ${a.n}`).join(' · ') : ''} <span class="mut">· total gravado neste computador: ${fmtN((logsCache || []).length)}</span></div>
  ${l.length ? `<div class="tabw"><table class="tb"><thead><tr><th>Data e hora</th><th>Usuário</th><th>Tipo</th><th>O que fez</th><th>Detalhe</th><th>Tela</th></tr></thead><tbody>${l.slice(0, logLimite).map(x => `<tr class="${/excluí|cancel|estorn|apagad|restaur|errad|bloque/i.test(x.ev) ? 'baixo' : ''}"><td style="white-space:nowrap">${fmtDH(x.q)}</td><td>${esc(x.u)}${x.perfil ? `<small>${esc(x.perfil)}</small>` : ''}</td><td><span class="tag ${x.cat === 'Acesso' ? 'ab' : x.cat === 'Navegação' || x.cat === 'Consultas' ? 'in' : 'ok'}">${esc(x.cat)}</span></td><td>${esc(x.ev)}</td><td>${esc(x.det)}</td><td><small>${esc(x.tela || '')}</small></td></tr>`).join('')}</tbody></table></div>
  ${l.length > logLimite ? `<div class="acoes"><button class="btn" data-act="logMais">Mostrar mais (${fmtN(l.length - logLimite)} restantes)</button></div>` : ''}` : '<p class="vazio">Nenhum registro neste filtro.</p>'}`;
}
ACT.logMais = () => { logLimite += 500; tabelaLogs(); };
const linhasLogExp = () => logsFiltrados().map(x => [fmtDH(x.q), x.u, x.perfil || '', x.cat, x.ev, x.det, x.tela || '']);
ACT.logCsv = () => baixarCsv('historico_logs', [['Data e hora', 'Usuário', 'Perfil', 'Tipo', 'O que fez', 'Detalhe', 'Tela']].concat(linhasLogExp()));
ACT.logXlsx = () => { const f = filtros.log; baixarXlsx('Histórico de logs', `${db.config.loja || ''} · ${fmtDia(f.de)} a ${fmtDia(f.ate)} · gerado em ${fmtDH(agora())}`, [C('Data e hora', 's'), C('Usuário', 's'), C('Perfil', 's'), C('Tipo', 's'), C('O que fez', 's'), C('Detalhe', 's'), C('Tela', 's')], linhasLogExp().map(c => ({ c })), `historico_logs_${f.de}_a_${f.ate}.xlsx`); };

/* histórico de versões */
function historicoVersoes() {
  if (!db.versoes) db.versoes = (db.auditoria || []).filter(a => a.ev === 'Sistema atualizado').map(a => { const [de, para] = String(a.det).split(' → '); return { v: para, de: de === 'versão anterior' ? '' : de, em: a.q }; });
  return db.versoes;
}
ACT.verVersoes = () => {
  const inst = historicoVersoes().slice().reverse(), ja = new Set(inst.map(x => x.v));
  abrirModal('Controle de versões', `<div class="resumo-tit"><div class="rbox ok"><small>Versão em uso</small><b>${esc(VERSAO_APP)}</b><span>dados gravados pela ${esc(db._versaoApp || '—')}</span></div><div class="rbox"><small>Atualizações neste computador</small><b>${inst.filter(x => !x.instalacao).length}</b><span>${inst[0] ? 'última em ' + fmtDH(inst[0].em) : ''}</span></div></div>
    <h4 class="rel-sec">Instaladas neste computador</h4>${inst.length ? tabSimples(['Versão', 'Veio da versão', 'Instalada em'], inst.map(x => [`<b>${esc(x.v)}</b>`, x.instalacao ? 'primeira instalação' : esc(x.de || 'sem número'), fmtDH(x.em)])) : '<p class="vazio">Nenhuma atualização registrada ainda.</p>'}
    <h4 class="rel-sec">Ciência dos administradores – versão ${esc(VERSAO_APP)}</h4>${tabSimples(['Administrador', 'Situação'], db.usuarios.filter(u => ehAdm(u) && u.ativo !== false).map(u => { const c = (db.cientes || []).filter(x => x.uid === u.id && x.v === VERSAO_APP).pop(); return [esc(u.nome), c ? `<span class="tag ok">Ciente em ${fmtDH(c.em)}</span>` : (u.cienteVersao || '') >= VERSAO_APP ? '<span class="tag ok">Ciente (cadastrado nesta versão)</span>' : '<span class="tag at">Ainda não leu</span>']; }))}
    <h4 class="rel-sec">O que mudou em cada versão</h4>${NOVIDADES.map(n => `<div class="ver-bloco"><b>${esc(n.v)}</b>${n.v === VERSAO_APP ? ' <span class="tag ok">em uso</span>' : ja.has(n.v) ? ' <span class="tag ab">instalada</span>' : ''}<ul class="sg-dicas">${n.itens.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}`, '', true);
};

/* ===== Início ===== */
(async () => {
  await carregarDados(); await carregarMinis(); conferirVersao(); confirmarAtualizacaoPendente(); await carregarPacoteBaixado(); await conferirPastaGuardada();
  try { const sid = +sessionStorage.getItem(CHAVE + '.sessao'); const u = db.usuarios.find(x => x.id === sid && x.ativo); if (u) eu = u; } catch (e) { }
  if (eu && atualizacaoConfirmadaAgora && master()) view = 'atualizacao';
  render(); if (eu) verNovidadesPendentes();
  if (atualizacaoConfirmadaAgora) aviso('Atualização confirmada: o sistema está na versão ' + VERSAO_APP + '.', 'ok');
  // backup automático: confere 4 s depois de abrir e depois a cada minuto
  setTimeout(verificarBackup, 4000); setInterval(verificarBackup, 60000);
  setTimeout(verificarNuvemSilencioso, 8000); setInterval(verificarNuvemSilencioso, 3 * 3600 * 1000);   // procura versão nova na nuvem
  window.sistemaPronto = true;
})();
</script>
