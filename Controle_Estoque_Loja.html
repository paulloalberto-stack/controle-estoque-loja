/* ===== Leitor de código de barras pela câmera (celular) =====
   Android: usa o leitor do próprio navegador (BarcodeDetector). iPhone (Safari não tem): leitor próprio de Code 128 (etiquetas
   do sistema) e EAN-13 (código do fabricante), lendo várias linhas do quadro da câmera. Só aceita depois de ler o mesmo código 2 vezes. */
const LEITOR = {};
const EAN_L = ['3211', '2221', '2122', '1411', '1132', '1231', '1114', '1312', '1213', '3112'];
const EAN_PAR = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'];
function maisParecido(runs, ini, n, total, padroes) {   // devolve [índice, distância] do padrão de larguras mais parecido
  let s = 0; for (let k = 0; k < n; k++) s += runs[ini + k];
  if (!s) return [-1, 99];
  let melhor = -1, dist = 99;
  for (let p = 0; p < padroes.length; p++) {
    const pd = padroes[p]; if (!pd) continue;
    let d = 0; for (let k = 0; k < n; k++) d += Math.abs(runs[ini + k] * total / s - pd.charCodeAt(k) + 48);
    if (d < dist) { dist = d; melhor = p; }
  }
  return [melhor, dist];
}
function lerCode128(runs) {
  for (let i = 1; i + 6 * 3 + 7 <= runs.length; i += 2) {   // índices ímpares = barras (o 1º trecho é o fundo claro)
    const [st, ds] = maisParecido(runs, i, 6, 11, C128.slice(0, 106));
    if (st < 103 || ds > 2.2) continue;
    const s0 = runs.slice(i, i + 6).reduce((a, b) => a + b, 0) / 11;
    if (runs[i - 1] < s0 * 4) continue;   // precisa de margem clara antes do início
    const cods = [st]; let j = i + 6, fim = false;
    while (j + 6 <= runs.length) {
      if (j + 7 <= runs.length) { const [sp, dsp] = maisParecido(runs, j, 7, 13, ['2331112']); const m7 = runs.slice(j, j + 7).reduce((x, y) => x + y, 0) / 13; if (sp === 0 && dsp < 2.6 && (j + 7 >= runs.length || runs[j + 7] >= m7 * 4)) { fim = true; break; } }
      const [c, d] = maisParecido(runs, j, 6, 11, C128.slice(0, 106));
      if (c < 0 || d > 2.4 || c >= 103) break;
      cods.push(c); j += 6;
    }
    if (!fim || cods.length < 3) continue;
    let soma = cods[0]; for (let k = 1; k < cods.length - 1; k++) soma += cods[k] * k;
    if (soma % 103 !== cods[cods.length - 1]) continue;
    let modo = st === 103 ? 'A' : st === 104 ? 'B' : 'C', txt = '';
    for (let k = 1; k < cods.length - 1; k++) {
      const c = cods[k];
      if (modo === 'C') { if (c < 100) txt += (c < 10 ? '0' : '') + c; else if (c === 100) modo = 'B'; else if (c === 101) modo = 'A'; }
      else if (c === 99) modo = 'C';
      else if (c === 100 && modo === 'A') modo = 'B';
      else if (c === 101 && modo === 'B') modo = 'A';
      else if (c < 96) txt += modo === 'B' ? String.fromCharCode(c + 32) : (c < 64 ? String.fromCharCode(c + 32) : '');
    }
    if (txt) return txt;
  }
  return null;
}
function lerEan13(runs) {
  const G = EAN_L.map(x => x.split('').reverse().join(''));
  for (let i = 1; i + 59 <= runs.length; i += 2) {
    const u = (runs[i] + runs[i + 1] + runs[i + 2]) / 3;
    if (runs[i - 1] < u * 4 || Math.abs(runs[i] - u) > u * .7 || Math.abs(runs[i + 2] - u) > u * .7) continue;
    let dig = '', par = '', ok = true;
    for (let k = 0; k < 6 && ok; k++) {
      const [l, dl] = maisParecido(runs, i + 3 + k * 4, 4, 7, EAN_L), [g, dg] = maisParecido(runs, i + 3 + k * 4, 4, 7, G);
      if (Math.min(dl, dg) > 1.6) ok = false; else if (dl <= dg) { dig += l; par += 'L'; } else { dig += g; par += 'G'; }
    }
    if (!ok) continue;
    for (let k = 0; k < 6 && ok; k++) { const [r, dr] = maisParecido(runs, i + 32 + k * 4, 4, 7, EAN_L); if (dr > 1.6) ok = false; else dig += r; }
    const pri = EAN_PAR.indexOf(par);
    if (!ok || pri < 0) continue;
    const cod = pri + dig;
    let s = 0; for (let k = 0; k < 13; k++) s += +cod[k] * (k % 2 ? 3 : 1);
    if (s % 10 === 0) return cod;
  }
  return null;
}
function lerLinha(lum) {   // linha de luminosidade → código (ou null)
  const n = lum.length, W = Math.max(10, n >> 6);
  let min = 255, max = 0; for (let x = 0; x < n; x++) { if (lum[x] < min) min = lum[x]; if (lum[x] > max) max = lum[x]; }
  if (max - min < 40) return null;
  const runs = []; let cor = 0, tam = 0;   // cor 0 = claro; limite = meio entre o mais claro e o mais escuro da vizinhança
  for (let x = 0; x < n; x++) {
    let lo = 255, hi = 0; for (let k = Math.max(0, x - W), f = Math.min(n - 1, x + W); k <= f; k++) { const v = lum[k]; if (v < lo) lo = v; if (v > hi) hi = v; }
    const esc = hi - lo > (max - min) * .3 && lum[x] < (lo + hi) / 2 ? 1 : 0;
    if (esc === cor) tam++; else { runs.push(tam); cor = esc; tam = 1; }
  }
  runs.push(tam); if (cor === 1) runs.push(n);   // termina sempre em claro
  if (runs.length < 25) return null;
  for (const r of [runs, runs.slice().reverse()]) {
    if (r !== runs && r.length % 2 === 0) continue;
    const c = lerCode128(r) || lerEan13(r); if (c) return c;
  }
  return null;
}
function lerQuadro(img) {   // ImageData → lista de códigos lidos nas linhas do meio
  const { width: w, height: h, data: d } = img, achados = [];
  for (let k = 0; k < 15; k++) {
    const y = Math.round(h * (.3 + .4 * k / 14)), lum = new Uint8ClampedArray(w), o = y * w * 4;
    for (let x = 0; x < w; x++) lum[x] = (d[o + x * 4] * 77 + d[o + x * 4 + 1] * 150 + d[o + x * 4 + 2] * 29) >> 8;
    const c = lerLinha(lum); if (c) achados.push(c);
  }
  return achados;
}
function bip() {
  try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 1800; g.gain.value = .15; o.connect(g); g.connect(a.destination); o.start(); setTimeout(() => { o.stop(); a.close(); }, 120); } catch (e) { }

}
ACT.lerCamera = async el => {
  const tipo = el.dataset.tipo;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return aviso('Este navegador não libera a câmera. Abra o sistema pelo endereço https da loja.', 'erro');
  abrirModal('Ler código de barras', `<div class="leitor"><video id="lt-video" playsinline muted autoplay></video><div class="lt-mira"></div></div>
    <p class="mut" id="lt-msg" style="text-align:center;margin:10px 0 0">Aponte a câmera para o código de barras da etiqueta, deitado na linha vermelha.</p>
    <div id="lt-ultimo" class="mut" style="text-align:center"></div>`, '');
  try { camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }); }
  catch (e) { fecharModal(); return aviso('A câmera não foi liberada (' + (e.name === 'NotAllowedError' ? 'permissão negada: libere a câmera para este site nas configurações do navegador' : e.message) + ').', 'erro'); }
  const v = $('#lt-video'); if (!v) return pararCamera();
  v.srcObject = camStream; try { await v.play(); } catch (e) { }
  let det = null;
  try { if ('BarcodeDetector' in window) { const f = await BarcodeDetector.getSupportedFormats(); const q = ['code_128', 'ean_13', 'ean_8'].filter(x => f.indexOf(x) >= 0); if (q.length) det = new BarcodeDetector({ formats: q }); } } catch (e) { det = null; }
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });

  const passo = async () => {
    if (!document.contains(v) || !camStream) return;
    if (Date.now() > pausaAte && v.videoWidth) {
      let cods = [];
      try {
        if (det) cods = (await det.detect(v)).map(b => b.rawValue);
        else { const w = Math.min(v.videoWidth, 1600), h = Math.round(v.videoHeight * w / v.videoWidth); cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h); cods = lerQuadro(cx.getImageData(0, 0, w, h)); }
      } catch (e) { cods = []; }
      const c = cods[0];
      if (c && c === ultimo && Date.now() - ultimoVisto < (tipo === 'inv' ? 1000 : 1500)) { ultimoVisto = Date.now(); }   // mesma etiqueta ainda na frente da câmera: não soma de novo
      else if (c) {
        const confirmado = det || cods.filter(x => x === c).length >= 2 || (c === antes && ++vezes >= 1);
        if (c !== antes) { antes = c; vezes = 0; }
        if (confirmado) {
          ultimo = c; ultimoVisto = Date.now(); pausaAte = Date.now() + 900; antes = ''; bip();
          const u = $('#lt-ultimo');

            if (u) u.innerHTML = r.erro ? `<b class="err">${esc(r.erro)}</b>` : `<b class="ok">✓ ${esc(nomeCompleto(r.p))}</b> · contado: <b>${r.total}</b> · leia a próxima peça`;
          } else {
