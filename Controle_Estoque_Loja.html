<style>

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}

.btn.ac{background:var(--ac);border-color:var(--ac);color:#fff}

.lnk{border:0;background:none;color:var(--pri2);font-weight:600;padding:2px 4px;text-decoration:underline}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a5f,#0f1f33);padding:16px}

.pags{margin:10px 0}

main{flex:1;min-width:0;padding:20px 24px 40px}
.alerta{background:#fef3c7;border:1px solid #f59e0b;color:#78350f;padding:10px 14px;border-radius:8px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:12px 14px}
.kpi .t{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}

.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}

.picker{display:flex;gap:8px}
.picker input:first-child{flex:1}
input.qtd{width:80px;text-align:right}
input.val{width:110px;text-align:right}
.tabw{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;margin:8px 0}
.tb th{background:var(--soft);text-align:left;font-size:12px;color:var(--mut);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}

.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.ok{background:#dcfce7;color:#166534}.tag.bx{background:#fee2e2;color:#991b1b}.tag.zr{background:#e5e7eb;color:#374151}.tag.in{background:#e5e7eb;color:#6b7280}.tag.at{background:#fee2e2;color:#991b1b}.tag.ab{background:#dbeafe;color:#1e40af}
.totais{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:flex-end;padding:10px 0;border-top:1px solid var(--line)}
.totais .inl{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);font-weight:400}
.totais .inl input{width:90px}.totais .inl select{width:65px}

.acoes{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* modal */
.fundo{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50}

.modal .mh h3{margin:0}
.modal .mb{padding:18px}

.chks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chks label{display:flex;align-items:center;gap:4px;border:1px solid #cbd5e1;border-radius:6px;padding:5px 9px;color:var(--ink);font-weight:600;font-size:13px}
.chks input{width:auto;margin:0}
label.chk{display:flex;align-items:center;gap:6px;color:var(--ink)}
label.chk input{width:auto}
#toast{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:420px}
#toast div{background:#1f2937;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast div.erro{background:var(--err)}#toast div.ok{background:var(--ok)}
/* documento (recibo / termo) */
.doc{font-size:13px;color:#000;background:#fff}
.doc-cab{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
.doc-loja{font-size:18px;font-weight:700}
.doc-tit{text-align:right;font-weight:700;font-size:15px}
.doc-tit div{font-size:13px}
.doc .via{font-size:11px;font-weight:700;letter-spacing:.08em;text-align:right;margin-bottom:4px}
.doc table{width:100%;border-collapse:collapse;margin:8px 0}
.doc th,.doc td{border:1px solid #999;padding:4px 6px;font-size:12px}
.doc th{background:#eee}
.doc .dados{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin-bottom:6px}
.doc .decl{margin:12px 0;font-size:12.5px}
.doc .assin{display:flex;gap:40px;margin-top:44px}
.doc .assin div{flex:1;border-top:1px solid #000;text-align:center;padding-top:3px;font-size:12px}
.doc .tot{text-align:right;font-size:13px}

.corte{border-top:1px dashed #000;margin:22px 0;position:relative}

.duas .meia{height:136mm;overflow:hidden;position:relative}
.duas .meia-in{transform-origin:top left}
.duas .corte{margin:2.5mm 0}
.duas.lado{display:flex;justify-content:space-between;align-items:flex-start}
.duas.lado .meia{width:136mm;height:192mm}
.duas.lado .corte{border-top:0;border-left:1px dashed #000;margin:0;height:192mm}
.duas.lado .corte::after{display:none}
.duas .corte::after{content:'\2702  recorte aqui';position:absolute;right:0;top:-7px;background:#fff;font-size:9px;padding-left:4px}
.duas .doc-cab{padding-bottom:5px;margin-bottom:6px}
.duas .doc-logo{max-height:52px}
.duas .doc .via{margin-bottom:2px}
.duas .decl{margin:6px 0}
.duas .assin{margin-top:26px}
.duas .doc th,.duas .doc td{padding:1.5px 5px;font-size:11px}
.duas .dados{font-size:12px}
.duas .doc-qr svg{width:78px;height:78px}
.aviso-min{background:#fef3c7;border:1px solid #f59e0b;color:#78350f;padding:10px 12px;border-radius:8px;margin-bottom:12px}
#print{display:none}
/* identidade e formatos de papel */
.doc{--dc:#1e3a5f}
.doc-cab{border-bottom-color:var(--dc)!important;align-items:flex-start}
.doc-logo{max-height:70px;max-width:150px;object-fit:contain}

.doc th{background:#eee}

.parc{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:1px 12px;font-size:11.5px;margin:4px 0;border:1px solid #999;padding:3px 6px}
.parc b{grid-column:1/-1}
.papel-80 .doc-fim,.papel-58 .doc-fim{flex-direction:column;align-items:center;text-align:center}
.papel-80 .fim-esq,.papel-58 .fim-esq{width:100%}
.doc-qr svg{display:block;margin:0 auto}
.doc-qr small{color:#000;font-size:10px}
.doc.papel-80,.doc.papel-58{width:72mm;font-size:11px;margin:0 auto}
.doc.papel-58{width:48mm;font-size:10px}
.papel-80 .doc-cab,.papel-58 .doc-cab{flex-direction:column;align-items:center;text-align:center;gap:4px}
.papel-80 .doc-tit,.papel-58 .doc-tit{text-align:center}
.papel-80 .doc-loja,.papel-58 .doc-loja{font-size:15px}
.papel-80 .dados,.papel-58 .dados{grid-template-columns:1fr}
.papel-80 .c-cod,.papel-80 .c-marca,.papel-58 .c-cod,.papel-58 .c-marca,.papel-58 .c-un{display:none}

.papel-80 .doc-rod,.papel-58 .doc-rod{flex-direction:column;align-items:center;text-align:center}
.papel-80 .decl,.papel-58 .decl{font-size:10.5px}
/* etiquetas */
.etqs{display:flex;flex-wrap:wrap;gap:0;justify-content:flex-start}
.etq{border:1px dashed #ccc;overflow:hidden;text-align:center;font-family:Arial,sans-serif;color:#000;background:#fff;page-break-inside:avoid;display:flex;flex-direction:column;justify-content:center;padding:1.5mm 2mm}
.etq-A4{width:64mm;height:37mm;margin:0 1mm 1.4mm 0}
.etq-50{width:50mm;height:30mm;page-break-after:always;border:0}
.etq-40{width:40mm;height:25mm;page-break-after:always;border:0;padding:1mm}
.etq{font-family:var(--ff,Arial),Arial,sans-serif}
.etq .e-loja{font-size:calc(8px * var(--ft,1));font-weight:700;white-space:nowrap;overflow:hidden}
.etq .e-desc{font-size:calc(9px * var(--ft,1));line-height:1.15;max-height:2.3em;overflow:hidden}

.etq .e-tam{font-size:calc(13px * var(--fp,1));font-weight:700;border:1px solid #000;border-radius:3px;padding:0 4px}
.etq .e-preco{font-size:calc(14px * var(--fp,1));font-weight:700}
.etq svg{display:block;width:100%}
.etq .e-cod{font-size:calc(8px * var(--ft,1));letter-spacing:.06em}
.etq-40 .e-desc{font-size:calc(8px * var(--ft,1));max-height:1.2em}.etq-40 .e-preco{font-size:calc(12px * var(--fp,1))}.etq-40 .e-tam{font-size:calc(11px * var(--fp,1))}
.etq.cx-normal .e-loja{text-transform:uppercase}.etq .e-loja{text-transform:none}
.etq-prev{background:#f3f4f6;padding:10px;border-radius:8px;max-height:420px;overflow:auto}
.etq-prev .etq{border:1px dashed #9ca3af}
/* ===== Tema moderno (sobrepõe o visual da tela; não altera recibos e etiquetas) ===== */
:root{--bg:#f4f5f7;--card:#fff;--ink:#141a26;--mut:#6b7385;--pri:#16213a;--pri2:#24345a;--ac:#2f5bd3;--ac2:#4a73e0;--ok:#15803d;--err:#c2410c;--line:#e7e9ee;--soft:#f8f9fb;--ring:rgba(47,91,211,.18);--sh:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.06);--sh2:0 12px 32px rgba(16,24,40,.14)}
body{font:14px/1.5 "Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h2{font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin:2px 0 18px}
h3{font-size:15px;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
input,select,textarea{border:1px solid #d9dce3;border-radius:10px;padding:9px 11px;transition:border-color .15s,box-shadow .15s;background:#fff}
input:hover,select:hover,textarea:hover{border-color:#c4c8d2}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px var(--ring)}
label{font-size:11.5px;letter-spacing:.02em;color:#5b6375;font-weight:600}
.btn{border:1px solid #d9dce3;border-radius:10px;padding:9px 16px;font-weight:600;background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.05);transition:background .15s,transform .05s,box-shadow .15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--soft);border-color:#c4c8d2}
.btn:active{transform:translateY(1px)}
.btn.pri{background:#16213a;border-color:#16213a;color:#fff}
.btn.pri:hover{background:#22325a}
.btn.ac{background:#2f5bd3;border-color:#2f5bd3;color:#fff}
.btn.ac:hover{background:#264bb3}
.btn.perigo{background:#fff;border-color:#f3c3b3;color:#b42318}
.btn.perigo:hover{background:#fff4f0}
.lnk{color:#24345a;text-decoration:none;font-weight:600;border-radius:6px;padding:3px 7px}
.lnk:hover{background:#eef1f7}
.lnk.perigo{color:#b42318}.lnk.perigo:hover{background:#fff1ec}
/* menu lateral */
.side{width:248px;background:#111a2e;box-shadow:inset -1px 0 0 rgba(255,255,255,.05)}

.side-logo{border-radius:12px}

/* ===== Banco de dados =====
   Principal: IndexedDB (sem o limite de ~5 MB), cada gravação com código de conferência (SHA-256) e a gravação anterior guardada.

function produtos() {
  const f = filtros.prod;
  const marcas = [...new Set(db.produtos.map(p => p.marca))].sort();
  const tams = [...new Set(db.produtos.map(p => p.tamanho))].sort((a, b) => ordTam(a) - ordTam(b) || a.localeCompare(b));
  const sel = (ch, lista, todos, rot) => `<select data-filtro="prod.${ch}">${[['', todos]].concat(lista.map(x => Array.isArray(x) ? x : [x, rot ? rot(x) : x])).map(([v, t]) => `<option value="${esc(v)}" ${String(f[ch]) === String(v) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;

      <label>Tamanho${sel('tam', tams, 'Todos')}</label>
      <label>Preço de venda${sel('faixa', FAIXAS.map((x, i) => [String(i), x[2]]), 'Todos')}</label>

      <div class="seg" title="Como mostrar a lista">${[['modelo', 'Por modelo'], ['tamanho', 'Por tamanho']].map(([v, t]) => `<button class="${(f.modo || 'modelo') === v ? 'on' : ''}" data-act="prodModo" data-v="${v}">${t}</button>`).join('')}</div></div>
    <div class="acoes" style="justify-content:space-between">
      <span class="mut" id="prod-resumo"></span>
      <span>${adm() ? '<button class="btn pri" data-act="novoProduto">+ Novo produto</button> <button class="btn ac" data-act="importarPlanilha">Importar planilha</button> <button class="btn" data-act="modeloPlanilha" title="Planilha de exemplo com as colunas que o sistema entende">Modelo da planilha</button> <button class="btn perigo" data-act="excluirSelecionados">Excluir selecionados</button> ' : ''}${adm() ? '<button class="btn pri" data-act="etiquetasSel">Etiquetas dos selecionados</button> ' : ''}<button class="btn" data-act="etiquetasFiltro">Etiquetas dos produtos listados</button> <button class="btn" data-act="imprimirCompra">Imprimir lista de compra</button></span>
    </div>
    <div id="tb-prod">${tabelaProdutos()}</div>
  </section>`;
}
const SITS_PROD = [['estoque', 'Com estoque'], ['zerado', 'Sem estoque'], ['abaixo', 'Abaixo do mínimo'], ['cond', 'Em condicional'], ['inativo', 'Inativos'], ['', 'Todos os ativos']];
function abasProd() {
  return SITS_PROD.map(([k, t]) => { const l = produtosFiltrados(k), m = new Set(l.map(chaveModelo)).size; return `<button class="${(filtros.prod.sit || '') === k ? 'on' : ''}${k === 'zerado' && l.length ? ' aba-alerta' : ''}" data-act="prodSit" data-v="${k}">${t} <span class="aba-n">${(filtros.prod.modo || 'modelo') === 'modelo' ? m : l.length}</span></button>`; }).join('');
}
function produtosFiltrados(sitForcada) {
  const f = filtros.prod, b = f.busca.trim().toLowerCase(), sit = sitForcada !== undefined ? sitForcada : f.sit;
  return ordenar(db.produtos.filter(p => {
    if (sit === 'inativo' ? p.ativo !== false : p.ativo === false) return false;
    if (sit === 'estoque' && p.estoque <= 0) return false;
    if (f.tipo && p.tipo !== f.tipo) return false;
    if (f.marca && p.marca !== f.marca) return false;
    if (f.tam && p.tamanho !== f.tam) return false;
    if (f.faixa !== '') { const x = FAIXAS[+f.faixa]; if (p.preco < x[0] || p.preco >= x[1]) return false; }
    if (f.col && (p.colecao || '') !== f.col) return false;
    if (sit === 'abaixo' && !estaBaixo(p)) return false;
    if (sit === 'zerado' && p.estoque > 0) return false;
    if (sit === 'cond' && !emCond(p.id)) return false;
    if (b && (p.codigo + ' ' + (p.barras || '') + ' ' + p.tipo + ' ' + p.descricao + ' ' + p.marca + ' ' + p.cor + ' ' + p.tamanho).toLowerCase().indexOf(b) < 0) return false;
    return true;
  }));
}
function tabelaModelos(l) {
  const sit = filtros.prod.sit || '', grupos = [...agrupar(l, chaveModelo)];
  setTimeout(() => { const r = $('#prod-resumo'); if (r) r.textContent = `${grupos.length} modelo(s) · ${l.length} produto(s) (tamanho) · ${fmtN(l.reduce((s, p) => s + p.estoque, 0))} peça(s) · ${fmtR(l.reduce((s, p) => s + p.estoque * p.preco, 0))} a preço de venda`; });
  if (!l.length) return `<p class="vazio">${db.produtos.length ? (sit === 'zerado' ? 'Nenhum produto sem estoque. Tudo com peças na loja.' : 'Nenhum produto com esses filtros.') : 'Nenhum produto cadastrado ainda.' + (adm() ? ' Clique em "+ Novo produto".' : '')}</p>`;
  return `<div class="tabw"><table class="tb tb-modelos"><thead><tr>${adm() ? '<th><input type="checkbox" id="sel-todos" title="Selecionar todos os listados"></th>' : ''}<th></th><th>Modelo</th><th>Marca</th><th>Cor</th><th>Tamanhos e estoque</th><th class="n">Peças</th><th class="n">Venda</th><th>Situação</th><th></th></tr></thead><tbody>${grupos.map(([k, lst]) => {
    const p0 = lst[0], todos = db.produtos.filter(x => (sit === 'inativo' ? x.ativo === false : x.ativo !== false) && chaveModelo(x) === k).sort((a, b) => ordTam(a.tamanho) - ordTam(b.tamanho) || String(a.tamanho).localeCompare(b.tamanho));
    const pecas = todos.reduce((s, x) => s + x.estoque, 0), cond = todos.reduce((s, x) => s + emCond(x.id), 0), zerados = todos.filter(x => x.estoque <= 0), baixos = todos.filter(x => x.estoque > 0 && estaBaixo(x));
    const precos = [...new Set(todos.map(x => x.preco))], noFiltro = new Set(lst.map(x => x.id));
    const chip = x => `<button class="tam-chip${x.estoque <= 0 ? ' zero' : estaBaixo(x) ? ' baixo' : ''}${noFiltro.has(x.id) ? '' : ' fora'}" data-act="tamMenu" data-id="${x.id}" title="${esc(x.codigo)} · tamanho ${esc(x.tamanho)} · estoque ${x.estoque}${emCond(x.id) ? ' · ' + emCond(x.id) + ' em condicional' : ''} · mínimo ${x.minimo}"><b>${esc(x.tamanho)}</b><span>${x.estoque}</span></button>`;
    const situ = pecas <= 0 ? '<span class="tag zr">Sem estoque</span>' : zerados.length ? `<span class="tag bx">Faltam: ${zerados.map(x => esc(x.tamanho)).join(', ')}</span>` : baixos.length ? '<span class="tag bx">Abaixo do mínimo</span>' : '<span class="tag ok">OK</span>';
    return `<tr class="${pecas <= 0 ? 'linha-zero' : ''}">${adm() ? `<td><input type="checkbox" class="sel-prod" value="${lst.map(x => x.id).join(',')}"></td>` : ''}<td class="td-foto"><button class="mini-btn" data-act="verFoto" data-id="${p0.id}" title="Foto e tamanhos">${miniHTML(p0)}</button></td>
      <td><b>${esc(nomeProd(p0))}</b><small>${esc(todos.map(x => x.codigo).slice(0, 1)[0] || '')}${todos.length > 1 ? ' … ' + esc(todos[todos.length - 1].codigo) : ''}${p0.colecao ? ' · ' + esc(p0.colecao) : ''}</small></td><td>${esc(p0.marca)}</td><td>${esc(p0.cor || '')}</td>
      <td><div class="tam-grade">${todos.map(chip).join('')}</div></td><td class="n"><b>${pecas}</b>${cond ? `<small>${cond} em cond.</small>` : ''}</td><td class="n">${precos.length > 1 ? fmtR(Math.min(...precos)) + ' a ' + fmtR(Math.max(...precos)) : fmtR(precos[0])}</td><td>${situ}</td>
      <td class="n"><button class="lnk" data-act="etqModelo" data-ids="${todos.map(x => x.id).join(',')}">Etiquetas</button></td></tr>`;
  }).join('')}</tbody></table></div><p class="mut">Clique num tamanho para ver as ações dele (${adm() ? 'editar, ajustar estoque, histórico, etiquetas, excluir' : 'histórico, etiquetas'}). Vermelho = sem estoque · laranja = abaixo do mínimo.</p>`;
}
function tabelaProdutos() {
  const l = produtosFiltrados();
  if ((filtros.prod.modo || 'modelo') === 'modelo') return tabelaModelos(l);
  setTimeout(() => { const r = $('#prod-resumo'); if (r) r.textContent = `${l.length} produto(s) · ${fmtN(l.reduce((s, p) => s + p.estoque, 0))} peça(s) · ${fmtR(l.reduce((s, p) => s + p.estoque * p.preco, 0))} a preço de venda`; });
  if (!l.length) return `<p class="vazio">${db.produtos.length ? 'Nenhum produto com esses filtros.' : 'Nenhum produto cadastrado ainda.' + (adm() ? ' Clique em "+ Novo produto".' : '')}</p>`;
  return `<div class="tabw"><table class="tb"><thead><tr>${adm() ? '<th><input type="checkbox" id="sel-todos" title="Selecionar todos os listados"></th>' : ''}<th></th><th>Código</th><th>Tipo</th><th>Descrição</th><th>Marca</th><th>Tam.</th><th>Cor</th>${adm() ? '<th class="n">Custo</th>' : ''}<th class="n">Venda</th><th class="n">Estoque</th><th class="n">Em cond.</th><th class="n">Mínimo</th><th>Situação</th><th></th></tr></thead><tbody>${l.map(p => { const ec = emCond(p.id); return `<tr class="${estaBaixo(p) ? 'baixo' : ''}">${adm() ? `<td><input type="checkbox" class="sel-prod" value="${p.id}"></td>` : ''}<td class="td-foto"><button class="mini-btn" data-act="verFoto" data-id="${p.id}" title="Ver foto e tamanhos">${miniHTML(p)}</button></td><td>${esc(p.codigo)}${p.barras ? `<small>${esc(p.barras)}</small>` : ''}</td><td>${esc(p.tipo)}</td><td>${esc(p.descricao)}${p.colecao ? `<small>${esc(p.colecao)}</small>` : ''}</td><td>${esc(p.marca)}</td><td><b>${esc(p.tamanho)}</b></td><td>${esc(p.cor)}</td>${adm() ? `<td class="n">${fmtR(p.custo)}</td>` : ''}<td class="n">${fmtR(p.preco)}</td><td class="n"><b>${p.estoque}</b></td><td class="n">${ec || ''}</td><td class="n">${p.minimo}</td><td>${situacao(p)}</td><td class="n"><button class="lnk" data-act="etiquetas" data-id="${p.id}">Etiquetas</button><button class="lnk" data-act="histProduto" data-id="${p.id}">Histórico</button>${adm() ? `<button class="lnk" data-act="editarProduto" data-id="${p.id}">Editar</button><button class="lnk" data-act="ajustarEstoque" data-id="${p.id}">Ajustar</button><button class="lnk perigo" data-act="excluirProduto" data-id="${p.id}">Excluir</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`;
}

const TIPOS_MOV = ['INVENTÁRIO', 'ENTRADA', 'VENDA', 'CONDICIONAL SAÍDA', 'CONDICIONAL DEVOLUÇÃO', 'VENDA DE CONDICIONAL', 'TROCA / DEVOLUÇÃO', 'CANCELAMENTO DE VENDA', 'AJUSTE', 'EXCLUSÃO DE ENTRADA'];
function movs() {
  const f = filtros.mov;
  return `<h2>Movimentações de estoque</h2>
  <section class="card">
    <div class="filtros">
      <label class="lg">Produto<input data-filtro="mov.busca" value="${esc(f.busca)}" placeholder="código ou descrição"></label>
      <label>Tipo<select data-filtro="mov.tipo"><option value="">Todos</option>${TIPOS_MOV.map(t => `<option ${t === f.tipo ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label>De<input type="date" data-filtro="mov.de" value="${f.de}"></label>
      <label>Até<input type="date" data-filtro="mov.ate" value="${f.ate}"></label>
    </div>
    <div id="tb-mov">${tabelaMovs()}</div>
  </section>`;
}
function tabelaMovs() {
  const f = filtros.mov, b = f.busca.trim().toLowerCase();
  const l = db.movs.filter(m => {
    const p = prod(m.prod);
    if (f.tipo && m.tipo !== f.tipo) return false;
    if (f.de && m.data.slice(0, 10) < f.de) return false;
    if (f.ate && m.data.slice(0, 10) > f.ate) return false;
    if (b && (p.codigo + ' ' + nomeCompleto(p)).toLowerCase().indexOf(b) < 0) return false;
    return true;

function agrupa(lista, chave, val) { const m = new Map(); lista.forEach(x => { const k = chave(x); const a = m.get(k) || { k, n: 0, q: 0, v: 0, c: 0 }; val(a, x); m.set(k, a); }); return [...m.values()]; }
const somar = (l, f) => l.reduce((s, x) => s + (+f(x) || 0), 0), pecasDe = c => c.itens.reduce((s, i) => s + i.qtd, 0);
function tabSimples(cab, linhas, rodape) { return `<div class="tabw"><table class="tb"><thead><tr>${cab.map((c, i) => `<th class="${i ? 'n' : ''}">${c}</th>`).join('')}</tr></thead><tbody>${linhas.map(l => `<tr>${l.map((c, i) => `<td class="${i ? 'n' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody>${rodape ? `<tfoot><tr>${rodape.map((c, i) => `<td class="${i ? 'n' : ''}">${c}</td>`).join('')}</tr></tfoot>` : ''}</table></div>`; }
function conteudoRel() {
  const { de, ate } = filtros.rel;
  const vs = vendasValidas().filter(v => v.data.slice(0, 10) >= de && v.data.slice(0, 10) <= ate);
  const itens = []; vs.forEach(v => { const fator = v.subtotal ? v.total / v.subtotal : 0; v.itens.forEach(i => itens.push({ v, i, liq: i.qtd * i.preco * fator })); });
  const tot = vs.reduce((s, v) => s + v.total, 0), pcs = vs.reduce((s, v) => s + pecasV(v), 0);
  const porVend = agrupa(vs, v => v.usuario, (a, v) => { a.n++; a.q += pecasV(v); a.v += v.total; }).sort((a, b) => b.v - a.v);
  const porPag = agrupa([].concat(...vs.map(pagsVenda)), p => p.forma, (a, p) => { a.n++; a.v += p.valor; }).sort((a, b) => b.v - a.v);
  const porTipo = agrupa(itens, x => (prod(x.i.prod) || {}).tipo || '?', (a, x) => { a.q += x.i.qtd; a.v += x.liq; }).sort((a, b) => TIPOS.indexOf(a.k) - TIPOS.indexOf(b.k));
  const porMarcaV = agrupa(itens, x => x.i.marca, (a, x) => { a.q += x.i.qtd; a.v += x.liq; }).sort((a, b) => b.v - a.v);
  const at = ativos();
  const porMarcaE = agrupa(at, p => p.marca, (a, p) => { a.q += p.estoque; a.c += p.estoque * p.custo; a.v += p.estoque * p.preco; }).sort((a, b) => a.k.localeCompare(b.k));
  const porFaixa = FAIXAS.map(x => { const l = at.filter(p => p.preco >= x[0] && p.preco < x[1]); return [x[2], l.length, fmtN(l.reduce((s, p) => s + p.estoque, 0)), fmtR(l.reduce((s, p) => s + p.estoque * p.preco, 0))]; });
  // estoque tipo x tamanho
  const grade = TIPOS.map(t => {
    const l = at.filter(p => p.tipo === t); if (!l.length) return '';
    const tams = [...new Set(l.map(p => p.tamanho))].sort((a, b) => ordTam(a) - ordTam(b) || a.localeCompare(b));
    const linha = tams.map(tm => fmtN(l.filter(p => p.tamanho === tm).reduce((s, p) => s + p.estoque, 0)));

  }).join('');
  const b = abaixoMin();
  return `<div class="kpis">${kpi('Vendas no período', fmtR(tot), `${vs.length} venda(s) · ${fmtN(pcs)} peça(s)`, 'kpiVendas')}${kpi('Ticket médio', fmtR(vs.length ? tot / vs.length : 0), 'por vendedora', 'kpiTicket')}${kpi('Estoque (custo)', fmtR(at.reduce((s, p) => s + p.estoque * p.custo, 0)), 'venda: ' + fmtR(at.reduce((s, p) => s + p.estoque * p.preco, 0)), 'kpiEstoque')}${kpi('Abaixo do mínimo', b.length, 'produto(s)', 'kpiAbaixo')}</div>
  <div class="grid2">
    <section class="card"><h3>Vendas e comissão por vendedora</h3>${tabelaComissao(vs, de, ate)}</section>
    <section class="card"><h3>Vendas por forma de pagamento</h3>${tabSimples(['Pagamento', 'Lançamentos', 'Total'], porPag.map(a => [esc(a.k), a.n, fmtR(a.v)]), ['Total', somar(porPag, a => a.n), fmtR(somar(porPag, a => a.v))])}</section>
    <section class="card"><h3>Vendas por tipo de mercadoria</h3>${tabSimples(['Tipo', 'Peças', 'Total (com desconto)'], porTipo.map(a => [esc(a.k), fmtN(a.q), fmtR(a.v)]), ['Total', fmtN(somar(porTipo, a => a.q)), fmtR(somar(porTipo, a => a.v))])}</section>
    <section class="card"><h3>Vendas por marca</h3>${tabSimples(['Marca', 'Peças', 'Total (com desconto)'], porMarcaV.map(a => [esc(a.k), fmtN(a.q), fmtR(a.v)]), ['Total', fmtN(somar(porMarcaV, a => a.q)), fmtR(somar(porMarcaV, a => a.v))])}</section>

/* as duas vias na mesma folha A4: uma em cima da outra (retrato) ou lado a lado (paisagem),

function ajustarMeias() {
  const pr = $('#print'), duas = $$('#print .duas');

  const r = document.createElement('div'); r.style.height = '100mm'; pr.appendChild(r); const px = r.offsetHeight / 100; r.remove();
  const escala = (el, larg, alt) => {
    let z = 1;
    for (let i = 0; i < 6; i++) { el.style.width = (larg / z) + 'mm'; const n = Math.min(1, alt * px / el.offsetHeight); if (Math.abs(n - z) < 0.005) { z = n; break; } z = n; }
    el.style.width = (larg / z) + 'mm';
    return Math.min(z, alt * px / el.offsetHeight);
  };
  const vias = $$('#print .meia-in');
  const zRet = Math.min(...vias.map(el => escala(el, 194, 135)));
  const zPai = Math.min(...vias.map(el => escala(el, 136, 192)));
  const lado = zPai > zRet + 0.05;
  duas.forEach(x => x.classList.toggle('lado', lado));
  $('#pg').textContent = lado ? '@page{size:A4 landscape;margin:8mm}' : PAGINA.A4;
  vias.forEach(el => { const z = lado ? escala(el, 136, 192) : escala(el, 194, 135); el.style.transform = z < 0.999 ? `scale(${z})` : ''; });
  pr.style.cssText = '';
}

  if (fotoTemp && criados.length) aplicarFoto(criados, fotoTemp).then(render);
  if (criados.length) aviso(`${criados.length} produto(s) criado(s): tamanhos ${criados.map(x => x.tamanho).join(', ')}.`, 'ok');
  if (pulados.length) aviso(`Já existiam (não criados): tamanhos ${pulados.join(', ')}.`, 'erro');

const soDig = s => String(s || '').replace(/\D/g, '');
/* ===== Máscaras, CPF/CNPJ e busca de CEP ===== */
function mascara(tipo, v) {
  let d = soDig(v);
  if (tipo === 'tel') {
    d = d.slice(0, 11);
    if (d.length <= 2) return d.length ? '(' + d : '';
    if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
    if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
    return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  }
  if (tipo === 'cep') { d = d.slice(0, 8); return d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d; }
  if (tipo === 'doc' || tipo === 'cpf' || tipo === 'cnpj') {
    d = d.slice(0, tipo === 'cpf' ? 11 : 14);
    const p = (d.length <= 11 && tipo !== 'cnpj') ? [[3, '.'], [6, '.'], [9, '-']] : [[2, '.'], [5, '.'], [8, '/'], [12, '-']];
    let s = '';
    for (let i = 0; i < d.length; i++) { const m = p.find(x => x[0] === i); s += (m ? m[1] : '') + d[i]; }
    return s;
  }
  return v;
}
const repetido = c => c.split('').every(x => x === c[0]);
function cpfOk(v) {
  const c = soDig(v); if (c.length !== 11 || repetido(c)) return false;
  for (let t = 9; t < 11; t++) { let s = 0; for (let i = 0; i < t; i++) s += +c[i] * (t + 1 - i); if (((s * 10) % 11) % 10 !== +c[t]) return false; }
  return true;
}
function cnpjOk(v) {
  const c = soDig(v); if (c.length !== 14 || repetido(c)) return false;
  const dv = n => { let s = 0, p = n - 7; for (let i = 0; i < n; i++) { s += +c[i] * p--; if (p < 2) p = 9; } const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return dv(12) === +c[12] && dv(13) === +c[13];
}
const docOk = v => { const n = soDig(v).length; return n === 11 ? cpfOk(v) : n === 14 ? cnpjOk(v) : false; };
const telOk = v => { const n = soDig(v).length; return n === 10 || n === 11; };
// mensagem de erro (ou '') para o campo; vazio é aceito
function erroCampo(tipo, v) {
  if (!soDig(v)) return '';
  if (tipo === 'tel') return telOk(v) ? '' : 'Telefone deve ter DDD + número (10 ou 11 dígitos).';
  if (tipo === 'cep') return soDig(v).length === 8 ? '' : 'CEP deve ter 8 números.';
  if (tipo === 'cpf') return cpfOk(v) ? '' : 'CPF inválido. Confira os números.';
  if (tipo === 'cnpj') return cnpjOk(v) ? '' : 'CNPJ inválido. Confira os números.';
  if (tipo === 'doc') { const n = soDig(v).length; return docOk(v) ? '' : n === 11 ? 'CPF inválido. Confira os números.' : n === 14 ? 'CNPJ inválido. Confira os números.' : 'CPF tem 11 números e CNPJ tem 14.'; }
  return '';
}
// confere todos os campos com máscara dentro de um bloco; devolve true se estiver tudo certo
function conferirCampos(raiz) {
  let erro = '';
  $$(raiz + ' [data-mask]').forEach(el => {
    const m = erroCampo(el.dataset.mask, el.value); el.classList.toggle('invalido', !!m);
    if (m && !erro) {

      const pane = el.closest('.cfg-pane'); if (pane && !pane.classList.contains('on')) ACT.cfgAba({ dataset: { v: pane.dataset.aba } });
      const lab = el.closest('label'), nome = lab ? lab.firstChild.textContent.trim() : '';

}
function aplicarMascara(el, e) {
  const t = el.dataset.mask;
  if (!(e.type === 'input' && e.inputType && e.inputType.indexOf('delete') === 0)) { const v = mascara(t, el.value); if (v !== el.value) el.value = v; }
  if (e.type === 'change') { const m = erroCampo(t, el.value); el.classList.toggle('invalido', !!m); el.title = m; if (m) aviso(m, 'erro'); }
  else if (el.classList.contains('invalido') && !erroCampo(t, el.value)) { el.classList.remove('invalido'); el.title = ''; }
  if (t === 'cep' && el.dataset.rua && soDig(el.value).length === 8 && el.dataset.ult !== soDig(el.value)) cepAuto(el);
}
async function buscarCep(cep) {
  const d = soDig(cep);
  try {
    const r = await fetch(`https://viacep.com.br/ws/${d}/json/`), j = await r.json();
    if (j.erro) throw new Error('nao');
    return { rua: j.logradouro, bairro: j.bairro, cidade: j.localidade, uf: j.uf };
  } catch (e) {
    try {
      const r = await fetch(`https://brasilapi.com.br/api/cep/v1/${d}`); if (!r.ok) throw new Error('nao');
      const j = await r.json(); return { rua: j.street, bairro: j.neighborhood, cidade: j.city, uf: j.state };
    } catch (e2) { throw new Error(navigator.onLine === false ? 'Sem internet para buscar o CEP: preencha o endereço à mão.' : 'CEP não encontrado. Confira o número ou preencha o endereço à mão.'); }
  }
}
async function cepAuto(el) {
  const d = soDig(el.value); el.dataset.ult = d; el.classList.add('buscando');
  try {
    const r = await buscarCep(d), por = k => document.getElementById(el.dataset[k]);
    if (soDig(el.value) !== d) return;
    if (r.rua && por('rua')) por('rua').value = r.rua + (el.dataset.num ? '' : ', ');
    if (r.bairro && por('bairro')) por('bairro').value = r.bairro;
    if (r.cidade && por('cidade')) por('cidade').value = r.cidade + (r.uf ? '/' + r.uf : '');
    const f = r.rua ? (por('num') || por('rua')) : por('rua');
    if (f) { f.focus(); const n = f.value.length; try { f.setSelectionRange(n, n); } catch (e) { } }
    if ($('#cfg-prev')) previaCfg();
    aviso(`CEP ${mascara('cep', d)}: ${r.rua ? r.rua + ', ' : ''}${r.cidade}/${r.uf}`, 'ok');
  } catch (er) { el.dataset.ult = ''; aviso(er.message, 'erro'); }
  finally { el.classList.remove('buscando'); }
}

const rotuloCli = c => `${c.nome} | ${c.telefone || 'sem telefone'}${c.doc ? ' | ' + c.doc : ''}`;
function acharCliente(txt) {
  txt = (txt || '').trim(); if (!txt) return null;
  const l = txt.toLowerCase(), dg = soDig(txt);
  return db.clientes.find(c => rotuloCli(c).toLowerCase() === l) || db.clientes.find(c => c.nome.toLowerCase() === l) ||
    (dg.length >= 8 ? db.clientes.find(c => soDig(c.telefone) === dg || (c.doc && soDig(c.doc) === dg)) : null) || null;
}
function clientePorDados(nome, tel, doc, end) {
  nome = MAIUSC(nome); end = MAIUSC(end);
  const dg = soDig(tel);
  let c = (dg ? db.clientes.find(x => soDig(x.telefone) === dg) : null) || db.clientes.find(x => x.nome.toLowerCase() === nome.toLowerCase() && soDig(x.telefone) === dg);
  if (!c) { c = { id: db.seq.cli++, nome, telefone: tel, doc: doc || '', endereco: end || '', nascimento: '', obs: '', criado: agora() }; db.clientes.push(c); }
  else { if (doc && !c.doc) c.doc = doc; if (end && !c.endereco) c.endereco = end; }
  return c;
}
function linkWhats(tel, texto) { let n = soDig(tel); if (n.length === 10 || n.length === 11) n = '55' + n; return n.length >= 12 ? `https://wa.me/${n}?text=${encodeURIComponent(texto)}` : ''; }

  if (!c) { c = { id: db.seq.cli++, criado: agora() }; db.clientes.push(c); }

function trocas() {

function formTroca(v) {

      <label>O que fazer com o valor<select id="tr-dest"><option value="credito">Gerar crédito para o cliente (vale-troca)</option><option value="dinheiro">Devolver o dinheiro / estornar</option></select></label>
      ${c ? `<div style="align-self:end">Crédito para <b>${esc(c.nome)}</b> (saldo atual ${fmtR(saldoCredito(c.id))})</div>` : `<label>Cliente (escolha na lista ou digite o nome)<input id="tr-cli" data-maiusc list="dl-cli" value="${esc(v.cliente || '')}" autocomplete="off"></label><label>Telefone (para cliente novo)<input id="tr-tel" data-mask="tel" inputmode="tel" value="${esc(soDig(v.doc).length >= 10 ? v.doc : '')}"></label>`}

  </div>`;

function calcTroca() {
  let t = 0; $$('.tr-q').forEach(i => { const q = Math.min(int(i.value), +i.max), v = r2(q * +i.dataset.un); t += v; const td = $('#tr-t-' + i.dataset.k); if (td) td.textContent = q ? fmtR(v) : ''; });
  const el = $('#tr-total'); if (el) el.textContent = fmtR(t);
}
ACT.buscarVendaTroca = () => {
  const n = int($('#tr-num').value), v = db.vendas.find(x => x.id === n);
  if (!v) return aviso('Venda não encontrada. Confira o número do recibo.', 'erro');
  trocaVenda = v.id; render();
};
ACT.cancelarTroca = () => { trocaVenda = null; render(); };
ACT.confirmarTroca = () => {
  const v = db.vendas.find(x => x.id === +$('#troca').dataset.venda), dest = $('#tr-dest').value;
  const sel = $$('.tr-q').map(i => ({ k: +i.dataset.k, q: Math.min(int(i.value), +i.max), un: +i.dataset.un })).filter(x => x.q > 0);
  if (!sel.length) return aviso('Informe a quantidade a devolver.', 'erro');
  let c = v.clienteId ? cli(v.clienteId) : null;
  if (!c && dest === 'credito') {
    const txt = $('#tr-cli').value.trim(); c = acharCliente(txt);
    if (!c) { const tel = $('#tr-tel').value.trim(); if (!txt || soDig(tel).length < 8) return aviso('Para gerar crédito, informe o cliente (nome e telefone).', 'erro'); c = clientePorDados(txt, tel, '', ''); }
    v.clienteId = c.id; if (!v.cliente) v.cliente = c.nome;
  }
  const t = { id: db.seq.troca++, data: agora(), usuario: eu.nome, venda: v.id, vendaUsuarioId: v.usuarioId, clienteId: c ? c.id : null, cliente: c ? c.nome : v.cliente, destino: dest, motivo: $('#tr-mot').value.trim(), itens: [] };
  sel.forEach(x => { const i = v.itens[x.k], p = prod(i.prod); t.itens.push(Object.assign({}, i, { qtd: x.q, preco: x.un })); if (p) { p.estoque += x.q; mov(p, 'TROCA / DEVOLUÇÃO', x.q, `Troca nº ${nDoc(t.id)} – venda nº ${nDoc(v.id)}`); } });
  t.valor = r2(t.itens.reduce((s, i) => s + i.qtd * i.preco, 0));
  if (dest === 'credito') db.creditos.push({ id: db.seq.cred++, data: t.data, clienteId: c.id, valor: t.valor, ref: 'Troca nº ' + nDoc(t.id) + ' (venda nº ' + nDoc(v.id) + ')', usuario: eu.nome });

};

function tabelaTrocas() {

const LF = String.fromCharCode(10), CR = String.fromCharCode(13);

}

  await idbFazer('snap', 'readwrite', st => st.add(reg));
  const ids = await idbFazer('snap', 'readonly', st => st.getAllKeys());

/* ===== Fotos dos produtos =====
   Uma foto por modelo (vale para todos os tamanhos), reduzida para ~600 px em JPEG (~50-80 KB) + miniatura de 120 px.
   Ficam num banco separado (lojaRoupasFotos), fora dos dados: salvar uma venda não regrava as fotos. */
let fotoMini = {}, fotoTemp, fotoAlvo = null, camStream = null;
function idbFotos() {
  return new Promise((ok, er) => { const r = indexedDB.open('lojaRoupasFotos', 1); r.onupgradeneeded = () => r.result.createObjectStore('fotos'); r.onsuccess = () => ok(r.result); r.onerror = () => er(r.error); });
}
async function fotosOp(modo, fn) {
  const b = await idbFotos();
  return new Promise((ok, er) => { const t = b.transaction('fotos', modo), st = t.objectStore('fotos'); let res; const r = fn(st); if (r) r.onsuccess = () => { res = r.result; }; t.oncomplete = () => { b.close(); ok(res); }; t.onerror = () => { b.close(); er(t.error); }; });
}
const fotoGravar = (id, f) => MODO_SERVIDOR ? apiJson('fotos/' + encodeURIComponent(id), 'PUT', { img: f.img, mini: f.mini }) : fotosOp('readwrite', st => st.put({ img: f.img, mini: f.mini, quando: agora() }, id));
const fotoLer = id => MODO_SERVIDOR ? api('fotos/' + encodeURIComponent(id)) : fotosOp('readonly', st => st.get(id));
async function fotosTodas() {
  if (MODO_SERVIDOR) return api('fotos');
  const out = {};
  await fotosOp('readonly', st => { const c = st.openCursor(); c.onsuccess = () => { const k = c.result; if (k) { out[k.key] = { img: k.value.img, mini: k.value.mini }; k.continue(); } }; });
  return out;
}
async function carregarMinis() {
  if (MODO_SERVIDOR) { try { fotoMini = await api('fotos?minis=1'); } catch (e) { fotoMini = {}; } return; }
  try { const t = await fotosTodas(); fotoMini = {}; for (const k in t) fotoMini[k] = t[k].mini; } catch (e) { fotoMini = {}; }
}
async function limparFotosOrfas() {
  const usadas = new Set(db.produtos.map(p => p.foto).filter(Boolean));
  if (MODO_SERVIDOR) { const r = await apiJson('fotos/limpar', 'POST', { usadas: [...usadas] }); (r.removidas || []).forEach(id => { delete fotoMini[id]; }); return (r.removidas || []).length; }
  const ids = await fotosOp('readonly', st => st.getAllKeys());
  const sobra = (ids || []).filter(id => !usadas.has(id));
  if (sobra.length) await fotosOp('readwrite', st => { sobra.forEach(id => { st.delete(id); delete fotoMini[id]; }); });
  return sobra.length;
}
async function restaurarFotos(fotos) {
  if (MODO_SERVIDOR) { await apiJson('fotos/lote', 'POST', fotos); await carregarMinis(); render(); return; }
  await fotosOp('readwrite', st => { for (const id in fotos) if (fotos[id] && fotos[id].img) st.put({ img: fotos[id].img, mini: fotos[id].mini || fotos[id].img, quando: agora() }, id); });
  await carregarMinis(); render();
}
// texto do arquivo de backup: dados + fotos (se a opção estiver ligada)
async function textoComFotos(txt) {
  if (cfgBk().fotos !== false && db.produtos.some(p => p.foto)) { const f = await fotosTodas(); if (Object.keys(f).length) txt = txt.slice(0, -1) + ',"_fotos":' + JSON.stringify(f) + '}'; }
  if (cfgBk().logs !== false) { try { const l = await logTodos(); if (l.length) txt = txt.slice(0, -1) + ',"_logs":' + JSON.stringify(l) + '}'; } catch (e) { } }
  return txt;
}
const chaveModelo = p => [p.tipo, p.descricao, p.marca, p.cor || ''].join('|').toLowerCase();
const miniHTML = p => p && p.foto && fotoMini[p.foto] ? `<img class="mini" src="${fotoMini[p.foto]}" alt="">` : '<span class="mini mini-vazia" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><polyline points="21 16 15 11 5 19"/></svg></span>';
// aplica a foto (ou remove, com null) em todos os tamanhos do mesmo modelo
async function aplicarFoto(produtos, foto) {
  const alvo = new Set(); produtos.forEach(p => db.produtos.forEach(x => { if (chaveModelo(x) === chaveModelo(p)) alvo.add(x); }));
  if (foto) { const id = 'F' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); await fotoGravar(id, foto); fotoMini[id] = foto.mini; alvo.forEach(x => { x.foto = id; }); }
  else alvo.forEach(x => { delete x.foto; });
  registrar(foto ? 'Foto do produto alterada' : 'Foto do produto removida', [...alvo].map(x => x.codigo).slice(0, 6).join(', '));
  salvar(); if (!MODO_REDE) limparFotosOrfas().catch(() => { });   // fotos sem uso são limpas pelo computador do caixa
  return alvo.size;
}
function processarImagem(src) {
  return new Promise((ok, er) => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
      const m = document.createElement('canvas'), lado = Math.min(im.width, im.height); m.width = m.height = 120;
      const gm = m.getContext('2d'); gm.fillStyle = '#fff'; gm.fillRect(0, 0, 120, 120); gm.drawImage(im, (im.width - lado) / 2, (im.height - lado) / 2, lado, lado, 0, 0, 120, 120);
      ok({ img: c.toDataURL('image/jpeg', 0.82), mini: m.toDataURL('image/jpeg', 0.75) });
    };
    im.onerror = () => er(new Error('Não foi possível ler esta imagem. Use JPG ou PNG (foto de iPhone em HEIC precisa ser convertida).'));
    im.src = src;
  });
}
function blocoFoto(fotoId) {
  return `<div class="foto-box"><div class="foto-prev" id="foto-prev">${fotoId && fotoMini[fotoId] ? `<img src="${fotoMini[fotoId]}" alt="">` : miniHTML(null)}</div>
    <div class="foto-acoes"><b>Foto do modelo</b><small class="mut">Vale para todos os tamanhos deste modelo. A imagem é reduzida automaticamente.</small>
      <div><label class="btn">Escolher arquivo<input type="file" id="foto-arq" accept="image/*" hidden></label> <button class="btn" data-act="camAbrir">Tirar foto (câmera)</button> <button class="lnk perigo" data-act="fotoRemover">Remover</button></div>
      <div id="cam-area" hidden><video id="cam-video" autoplay playsinline muted></video><div><button class="btn pri" data-act="camCapturar">Capturar</button> <button class="btn" data-act="camFechar">Cancelar</button></div></div></div></div>`;
}
async function usarFoto(foto) {
  if (fotoAlvo === 'form') { fotoTemp = foto; $('#foto-prev').innerHTML = foto ? `<img src="${foto.mini}" alt="">` : miniHTML(null); return; }
  const p = prod(fotoAlvo); if (!p) return;
  let n; try { n = await aplicarFoto([p], foto); } catch (e) { return aviso('A foto não foi salva: ' + (e.message || e) + '.', 'erro'); }
  aviso(foto ? `Foto salva (${n} tamanho(s) deste modelo).` : 'Foto removida.', 'ok');
  render(); ACT.verFoto({ dataset: { id: p.id } });
}
function lerFotoArquivo(arq) {
  const r = new FileReader();
  r.onload = () => processarImagem(r.result).then(usarFoto, e => aviso(e.message, 'erro'));
  r.readAsDataURL(arq);
}
function pararCamera() { if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
ACT.camAbrir = async () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return aviso('Este computador não oferece câmera para o navegador.', 'erro');
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
    $('#cam-video').srcObject = camStream; $('#cam-area').hidden = false;
  } catch (e) { aviso('Não foi possível usar a câmera (' + (e.name === 'NotAllowedError' ? 'permissão negada' : e.name === 'NotFoundError' ? 'nenhuma câmera encontrada' : e.message) + ').', 'erro'); }
};
ACT.camCapturar = () => {
  const v = $('#cam-video'); if (!v || !v.videoWidth) return aviso('A câmera ainda está ligando. Tente de novo.', 'erro');
  const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0);
  pararCamera(); $('#cam-area').hidden = true;
  processarImagem(c.toDataURL('image/jpeg', 0.92)).then(usarFoto, e => aviso(e.message, 'erro'));

ACT.camFechar = () => { pararCamera(); $('#cam-area').hidden = true; };
ACT.fotoRemover = () => usarFoto(null);
ACT.verFoto = async el => {

    <div class="foto-info"><div class="pix-valor">${fmtR(p.preco)}</div><small class="mut">${esc(p.codigo)}${p.colecao ? ' · ' + esc(p.colecao) : ''}</small>
    <div class="foto-tams">${tams.map(x => `<span class="${x.id === p.id ? 'on' : ''}${x.estoque <= 0 ? ' zero' : ''}" title="estoque ${x.estoque}">${esc(x.tamanho)}<small>${x.estoque}</small></span>`).join('')}</div><small class="mut">Tamanhos e estoque deste modelo.</small></div></div>

/* ===== Relatórios de estoque: sintético e analítico, com PDF e Excel ===== */
const REL_MODO_PADRAO = { grade: 'analitico', merc: 'sintetico', marca: 'sintetico', faixa: 'sintetico' };
const modoRel = k => { filtros.rel.modo = filtros.rel.modo || Object.assign({}, REL_MODO_PADRAO); return filtros.rel.modo[k]; };
const totaisEst = l => ({ m: new Set(l.map(chaveModelo)).size, n: l.length, q: l.reduce((s, p) => s + p.estoque, 0), c: l.reduce((s, p) => s + p.estoque * (p.custo || 0), 0), v: l.reduce((s, p) => s + p.estoque * p.preco, 0) });
function agrupar(l, f) { const m = new Map(); l.forEach(x => { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; }
const merc = p => `${p.tipo} ${p.descricao}`;
const ordTipoDesc = (a, b) => TIPOS.indexOf(a[1][0].tipo) - TIPOS.indexOf(b[1][0].tipo) || a[0].localeCompare(b[0]);
const pct = (q, t) => t ? q / t : 0;
const C = (t, f) => ({ t, f });
// tipo e tamanho
function relGrade(modo) {
  const at = ativos(), tg = totaisEst(at), r = { titulo: 'Estoque por tipo e tamanho', sub: 'Peças em estoque por mercadoria (tipo + descrição) e tamanho', secoes: [] };
  if (modo === 'sintetico') {
    const g = [...agrupar(at, p => p.tipo)].sort((a, b) => TIPOS.indexOf(a[0]) - TIPOS.indexOf(b[0]));
    r.secoes.push({ cols: [C('Tipo', 's'), C('Modelos', 'i'), C('Peças', 'i'), C('% das peças', 'p'), C('Custo', 'r'), C('Venda', 'r')],
      linhas: g.map(([k, l]) => { const t = totaisEst(l); return { c: [k, t.m, t.q, pct(t.q, tg.q), t.c, t.v] }; }).concat([{ k: 'tot', c: ['Total geral', tg.m, tg.q, 1, tg.c, tg.v] }]) });
    return r;
  }
  [...agrupar(at, p => p.tipo)].sort((a, b) => TIPOS.indexOf(a[0]) - TIPOS.indexOf(b[0])).forEach(([tipo, l]) => {
    const tams = [...new Set(l.map(p => p.tamanho))].sort((a, b) => ordTam(a) - ordTam(b) || String(a).localeCompare(b));
    const linha = (rot, ll, k) => { const t = totaisEst(ll); return { k, c: [rot].concat(tams.map(tm => ll.filter(p => p.tamanho === tm).reduce((s, p) => s + p.estoque, 0)), [t.q, t.v]) }; };
    r.secoes.push({ titulo: tipo, cols: [C('Mercadoria', 's')].concat(tams.map(t => C(t, 'i')), [C('Total', 'i'), C('Venda', 'r')]),
      linhas: [...agrupar(l, merc)].sort((a, b) => a[0].localeCompare(b[0])).map(([k, ll]) => linha(k, ll)).concat([linha('Total ' + tipo, l, 'tot')]) });
  });
  r.secoes.push({ titulo: 'Resumo', cols: [C('', 's'), C('Modelos', 'i'), C('Peças', 'i'), C('Custo', 'r'), C('Venda', 'r')], linhas: [{ k: 'tot', c: ['Total geral', tg.m, tg.q, tg.c, tg.v] }] });
  return r;
}
// por mercadoria (tipo + descrição); analítico abre por marca e cor
function relMerc(modo) {
  const at = ativos(), tg = totaisEst(at), g = [...agrupar(at, merc)].sort(ordTipoDesc);
  const cols = [C(modo === 'sintetico' ? 'Mercadoria' : 'Mercadoria / marca e cor', 's'), C('Modelos', 'i'), C('Peças', 'i'), C('% das peças', 'p'), C('Custo', 'r'), C('Venda', 'r')];
  const lin = (rot, l, k) => { const t = totaisEst(l); return { k, c: [rot, t.m, t.q, pct(t.q, tg.q), t.c, t.v] }; };
  let linhas = [];
  if (modo === 'sintetico') linhas = g.map(([k, l]) => lin(k, l));
  else g.forEach(([k, l]) => { linhas.push(lin(k, l, 'grp')); [...agrupar(l, p => p.marca + (p.cor ? ' – ' + p.cor : ''))].sort((a, b) => a[0].localeCompare(b[0])).forEach(([m, ll]) => linhas.push(lin('   ' + m, ll))); });
  return { titulo: 'Estoque por mercadoria', sub: 'Tipo + descrição (ex.: Camisa Manga curta)', secoes: [{ cols, linhas: linhas.concat([lin('Total geral', at, 'tot')]) }] };
}
// por marca; analítico abre por mercadoria
function relMarca(modo) {
  const at = ativos(), tg = totaisEst(at), g = [...agrupar(at, p => p.marca)].sort((a, b) => a[0].localeCompare(b[0]));
  const cols = [C(modo === 'sintetico' ? 'Marca' : 'Marca / mercadoria', 's'), C('Modelos', 'i'), C('Peças', 'i'), C('% das peças', 'p'), C('Custo', 'r'), C('Venda', 'r')];
  const lin = (rot, l, k) => { const t = totaisEst(l); return { k, c: [rot, t.m, t.q, pct(t.q, tg.q), t.c, t.v] }; };
  let linhas = [];
  if (modo === 'sintetico') linhas = g.map(([k, l]) => lin(k, l));
  else g.forEach(([k, l]) => { linhas.push(lin(k, l, 'grp')); [...agrupar(l, merc)].sort(ordTipoDesc).forEach(([m, ll]) => linhas.push(lin('   ' + m, ll))); });
  return { titulo: 'Estoque por marca', sub: modo === 'sintetico' ? 'Totais por marca' : 'Cada marca aberta por mercadoria (Lacoste – Camisa Manga longa, Bermuda…)', secoes: [{ cols, linhas: linhas.concat([lin('Total geral', at, 'tot')]) }] };
}
// por faixa de preço; analítico abre por mercadoria
function relFaixa(modo) {
  const at = ativos(), tg = totaisEst(at);
  const cols = [C(modo === 'sintetico' ? 'Faixa de preço' : 'Faixa / mercadoria', 's'), C('Produtos', 'i'), C('Peças', 'i'), C('% das peças', 'p'), C('Custo', 'r'), C('Venda', 'r')];
  const lin = (rot, l, k) => { const t = totaisEst(l); return { k, c: [rot, t.n, t.q, pct(t.q, tg.q), t.c, t.v] }; };

/* ===== Importação do XML da NF-e do fornecedor ===== */
function lerXmlNfe(txt) {
  const x = new DOMParser().parseFromString(txt, 'text/xml');
  if (x.getElementsByTagName('parsererror').length) return null;
  const t = (el, tag) => { const n = el && el.getElementsByTagName(tag)[0]; return n ? n.textContent.trim() : ''; };
  const emit = x.getElementsByTagName('emit')[0], ide = x.getElementsByTagName('ide')[0], dets = Array.from(x.getElementsByTagName('det'));
  if (!emit || !dets.length) return null;
  const gtin = s => /^\d{8,14}$/.test(s) ? s : '';
  return {
    forn: t(emit, 'xFant') || t(emit, 'xNome'), razao: t(emit, 'xNome'), cnpj: t(emit, 'CNPJ') || t(emit, 'CPF'), nf: t(ide, 'nNF'),
    itens: dets.map(dd => { const p = dd.getElementsByTagName('prod')[0]; return { cProd: t(p, 'cProd'), ean: gtin(t(p, 'cEAN')) || gtin(t(p, 'cEANTrib')), xProd: t(p, 'xProd'), un: t(p, 'uCom'), q: parseFloat(t(p, 'qCom')) || 0, vUn: parseFloat(t(p, 'vUnCom')) || 0 }; }),
    dups: Array.from(x.getElementsByTagName('dup')).map(dd => ({ n: t(dd, 'nDup'), venc: t(dd, 'dVenc'), valor: parseFloat(t(dd, 'vDup')) || 0 }))
  };
}
function adivinhaTipo(s) { s = s.toUpperCase(); return /CAL[CÇ]A|JEANS|SARJA/.test(s) && !/BERM/.test(s) ? 'Calça' : /BERM|SHORT/.test(s) ? 'Bermuda' : /CAMISETA|T-SHIRT|TSHIRT|REGATA/.test(s) ? 'Camiseta' : /POLO/.test(s) && !/RALPH|LAUREN/.test(s) ? 'Polo' : 'Camisa'; }
function limpaDesc(s, tam) {
  let w = s.trim().split(/\s+/);
  if (w.length > 1 && /^(CAL[CÇ]A|CAMISA|BERMUDA)$/i.test(w[0])) w.shift();
  if (w.length > 1 && w[w.length - 1].toUpperCase() === String(tam).toUpperCase()) w.pop();

/* criptografia dos arquivos de backup (AES-256-GCM, chave derivada da senha do backup) */
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(s); };
const deb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function chaveDeSenha(senha, sal, iter) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: sal, iterations: iter }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function cifrar(txt, chave, sal, iter) {
  const iv = crypto.getRandomValues(new Uint8Array(12)), c = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, chave, new TextEncoder().encode(txt)));
  return JSON.stringify({ formato: 'lojaRoupas-cripto', v: 1, alg: 'AES-256-GCM / PBKDF2-SHA256', iter, sal: b64(sal), iv: b64(iv), dados: b64(c) });
}
async function decifrar(obj, senha) {
  const chave = await chaveDeSenha(senha, deb64(obj.sal), obj.iter);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deb64(obj.iv) }, chave, deb64(obj.dados)));
}

}

/* conferência dos dados */
function conferirDados() {
  const prob = [], max = l => l.reduce((m, x) => Math.max(m, +x.id || 0), 0);
  const repet = (l, f) => { const v = {}, r = []; l.forEach(x => { const k = f(x); if (!k) return; if (v[k]) r.push(k); v[k] = 1; }); return [...new Set(r)]; };
  const neg = db.produtos.filter(p => p.estoque < 0); if (neg.length) prob.push(`${neg.length} produto(s) com estoque negativo: ${neg.slice(0, 5).map(p => p.codigo).join(', ')}`);
  const rc = repet(db.produtos, p => p.codigo && p.codigo.toUpperCase()); if (rc.length) prob.push('Códigos repetidos: ' + rc.slice(0, 5).join(', '));
  const rb = repet(db.produtos.filter(p => p.ativo !== false), p => p.barras); if (rb.length) prob.push('Códigos de barras repetidos: ' + rb.slice(0, 5).join(', '));
  const semProd = db.vendas.filter(v => v.itens.some(i => !prod(i.prod))).length; if (semProd) prob.push(`${semProd} venda(s) com produto que não existe mais (só histórico, não afeta o estoque).`);
  let corrigidos = 0;
  [['prod', 'produtos'], ['ent', 'entradas'], ['venda', 'vendas'], ['cond', 'condicionais'], ['mov', 'movs'], ['usu', 'usuarios'], ['cli', 'clientes'], ['cred', 'creditos'], ['troca', 'trocas'], ['rec', 'receber'], ['pag', 'pagar']].forEach(([s, k]) => {
    const m = max(db[k] || []); if ((db.seq[s] || 1) <= m) { db.seq[s] = m + 1; corrigidos++; }
  });
  if (corrigidos) { prob.push(`${corrigidos} numeração(ões) interna(s) estavam atrás do último registro e foram corrigidas.`); salvar(); }
  return prob;
}

async function infoArmazenamento() {
  const el = $('#sg-arm'); if (!el) return;
  let est = null, pers = false;
  try { est = await navigator.storage.estimate(); pers = await navigator.storage.persisted(); } catch (e) { }
  const mb = n => (n / 1048576).toFixed(1).replace('.', ',') + ' MB', tam = JSON.stringify(db).length;
  let tamFotos = 0, nFotos = 0; try { const f = await fotosTodas(); for (const k in f) { nFotos++; tamFotos += f[k].img.length + f[k].mini.length; } } catch (e) { }
  const ok = idbOk && !dbAlerta;
  el.outerHTML = `<div class="sg-item ${ok ? 'ok' : 'mal'}"><span class="sg-ic">${ok ? '✓' : '!'}</span><div><b>Banco de dados</b><small>${idbOk ? 'Banco interno (IndexedDB) com conferência de integridade a cada gravação e cópia da gravação anterior' : 'Banco interno indisponível: gravando só na área simples do navegador'}${lsCheio ? '; a cópia espelho do navegador está cheia (normal com muitos dados)' : ''}. Dados: ${mb(tam)}${nFotos ? ` · fotos: ${nFotos} (${mb(tamFotos)})` : ''}${est && est.quota ? ` · espaço disponível: ${mb(est.quota)}` : ''}${pers ? ' · protegido contra limpeza automática do navegador' : ''}.${dbAlerta ? ' Aviso: ' + esc(dbAlerta) : ''}</small></div></div>`;
  const ch = $('#sg-chave'); if (ch) { const k = await kvLer('chaveBackup').catch(() => null); ch.innerHTML = k ? '<span class="ok">A senha do backup está guardada neste computador: os backups automáticos saem criptografados.</span>' : '<span class="err">A senha do backup ainda não foi digitada neste computador: os arquivos de backup ficam parados até digitar.</span>'; }
}

/* ===== Números de documento clicáveis =====
   Em qualquer lista, tela ou janela: "Venda nº 000123", "Condicional nº …", "Troca nº …", "Entrada nº …", "Comissão nº …"
   e as colunas "Nº" / "Venda" das tabelas abrem o documento que gerou aquele número. */
const TIPOS_DOC = { venda: 'venda', vendas: 'venda', compra: 'venda', compras: 'venda', condicional: 'cond', condicionais: 'cond', troca: 'troca', trocas: 'troca', entrada: 'entrada', entradas: 'entrada', 'comissão': 'comissao' };
const RE_DOC = new RegExp('(venda|condicional|troca|entrada|comissão) nº ([0-9]{6})', 'gi');
const linkDocHTML = (t, n) => `<button class="lnk-doc" data-act="abrirDoc" data-t="${t}" data-id="${+n}" title="Abrir o documento">${n}</button>`;
function tipoPorContexto(tab, col) {
  const cab = (col || '').toLowerCase();
  if (cab === 'venda' || cab === 'venda original') return 'venda';
  const sec = tab.closest('section, .modal, .card'), h = sec ? (sec.querySelector('h3, h4') || {}).textContent || '' : '';
  const txt = (h + ' ' + (sec && sec.classList.contains('modal') ? '' : view)).toLowerCase();
  if (/condicion|em aberto|encerrada/.test(txt) && view !== 'vendas') return 'cond';
  if (/troca|devolu/.test(txt)) return 'troca';
  if (/entrada/.test(txt)) return 'entrada';
  if (/venda|compra|recibo/.test(txt)) return 'venda';
  return { vendas: 'venda', painel: 'venda', condicionais: 'cond', trocas: 'troca', entradas: 'entrada' }[view] || '';
}
function linkificarDocs(raiz) {
  if (!raiz) return;
  // colunas Nº / Venda das tabelas
  raiz.querySelectorAll('table').forEach(tab => {
    if (tab.closest('#print')) return;
    const ths = [...tab.querySelectorAll('thead th')].map(th => th.textContent.trim().toLowerCase());
    ths.forEach((h, i) => {
      if (h !== 'nº' && h !== 'venda' && h !== 'venda original') return;
      const t = tipoPorContexto(tab, h); if (!t) return;
      tab.querySelectorAll('tbody tr').forEach(tr => { const td = tr.children[i]; if (td && !td.querySelector('button, a, input') && /^[0-9]{6}$/.test(td.textContent.trim())) td.innerHTML = linkDocHTML(t, td.textContent.trim()); });
    });
  });
  // textos "Venda nº 000123" etc.
  const w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, { acceptNode: n => n.nodeValue.indexOf('nº') >= 0 && !n.parentElement.closest('button, a, input, textarea, select, option, #print') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  const nos = []; while (w.nextNode()) nos.push(w.currentNode);
  nos.forEach(n => {
    RE_DOC.lastIndex = 0; if (!RE_DOC.test(n.nodeValue)) return;
    RE_DOC.lastIndex = 0;
    const span = document.createElement('span');
    span.innerHTML = esc(n.nodeValue).replace(RE_DOC, (m, pal, num) => `${pal} nº ${linkDocHTML(TIPOS_DOC[pal.toLowerCase()], num)}`);
    n.replaceWith(...span.childNodes);
  });
}
let linkPendente = false;
const obsDocs = new MutationObserver(() => { if (linkPendente) return; linkPendente = true; requestAnimationFrame(() => { linkPendente = false; linkificarDocs($('#view')); linkificarDocs($('#modal')); }); });
['#view', '#modal'].forEach(s => { const el = $(s); if (el) obsDocs.observe(el, { childList: true, subtree: true }); });
ACT.abrirDoc = el => {
  const t = el.dataset.t, id = +el.dataset.id, ds = { dataset: { id } };
  if (t === 'venda') return db.vendas.some(v => v.id === id) ? ACT.verVenda(ds) : aviso('Venda nº ' + nDoc(id) + ' não encontrada.', 'erro');
  if (t === 'cond') { const c = db.condicionais.find(x => x.id === id); if (!c) return aviso('Condicional não encontrada.', 'erro'); return c.status === 'aberta' ? ACT.verCond(ds) : ACT.verAcerto(ds); }
  if (t === 'troca') return db.trocas.some(x => x.id === id) ? ACT.verTroca(ds) : aviso('Troca não encontrada.', 'erro');
  if (t === 'entrada') return db.entradas.some(x => x.id === id) ? ACT.verEntrada(ds) : aviso('Entrada não encontrada.', 'erro');
  if (t === 'comissao') return (db.comissoes || []).some(x => x.id === id) ? ACT.comRecibo(ds) : aviso('Comissão não encontrada.', 'erro');
};

/* ===== Atualização pela nuvem (GitHub) =====

/* ===== Ícone da loja no atalho da área de trabalho =====
   Feito a partir da logo das Configurações (sem logo: as iniciais da loja na cor do sistema). O servidor grava o .ico
   e troca o ícone do atalho "Controle de Estoque"; quando a logo muda, o ícone muda junto. */
// desenha reduzindo pela metade a cada etapa: imagem pequena sai nítida, sem serrilhado
function desenharNitido(g, img, x, y, w, h) {
  const k = Math.min(w / img.width, h / img.height), lw = img.width * k, lh = img.height * k;
  let src = img, sw = img.width, sh = img.height;
  while (sw / 2 >= lw && sh / 2 >= lh) {
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(sw / 2)); c.height = Math.max(1, Math.round(sh / 2));
    const cg = c.getContext('2d'); cg.imageSmoothingQuality = 'high'; cg.drawImage(src, 0, 0, c.width, c.height);
    src = c; sw = c.width; sh = c.height;
  }
  g.imageSmoothingQuality = 'high'; g.drawImage(src, x + (w - lw) / 2, y + (h - lh) / 2, lw, lh);
}
const carregarImg = u => u ? new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = u; }) : Promise.resolve(null);
async function pngsIcone(cfg) {
  cfg = cfg || db.config;
  const proprio = await carregarImg(cfg.icone);
  if (proprio) return [256, 48, 32, 16].map(t => { const c = document.createElement('canvas'); c.width = c.height = t; desenharNitido(c.getContext('2d'), proprio, 0, 0, t, t); return c.toDataURL('image/png').split(',')[1]; });
  const logo = cfg.logo, img = await carregarImg(logo);
  return [256, 48, 32, 16].map(t => {
    const c = document.createElement('canvas'); c.width = c.height = t; const g = c.getContext('2d'), r = t * .18;
    g.fillStyle = img ? '#ffffff' : (cfg.cor || '#1e3a5f');
    g.beginPath(); g.moveTo(r, 0); g.arcTo(t, 0, t, t, r); g.arcTo(t, t, 0, t, r); g.arcTo(0, t, 0, 0, r); g.arcTo(0, 0, t, 0, r); g.closePath(); g.fill();
    if (img) {
      const m = t * (t <= 32 ? .03 : .08); desenharNitido(g, img, m, m, t - 2 * m, t - 2 * m);
    } else {
      g.fillStyle = '#fff'; g.font = `700 ${Math.round(t * .42)}px "Segoe UI", sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(iniciais(cfg.loja || 'Loja'), t / 2, t * .53);
    }
    return c.toDataURL('image/png').split(',')[1];
  });
}
// ícone da janela (barra de tarefas e aba do Edge) com a logo da loja
async function aplicarFavicon() {
  try { const p = await pngsIcone(); $('#favicon').href = 'data:image/png;base64,' + p[0]; } catch (e) { }
}
async function atualizarIconeLoja(forcar) {
  if (!MODO_SERVIDOR || !srvInfo) return null;
  const h = (await hashTxt([db.config.icone || '', db.config.logo || '', db.config.loja || '', db.config.cor || ''].join('|'))).slice(0, 12);
  if (!forcar && srvInfo.iconeHash === h && srvInfo.icone) return null;
  const r = await apiJson('icone', 'POST', { hash: h, pngs: await pngsIcone() });
  srvInfo.iconeHash = h; srvInfo.icone = r.icone; return r;
}
ACT.criarAtalho = async () => {
  if (!MODO_SERVIDOR) return aviso('Abra o sistema pelo atalho para criar o atalho com a logo.', 'erro');

};

const seloQuem = q => q === 'adm' ? ' <span class="tag in">administrador</span>' : q === 'master' ? ' <span class="tag in">master</span>' : '';

  return `${cabTela('Ajuda')}

/* ===== Licença de uso (P.A.S Soluções Tecnológicas) =====
   Código "PAS1-dados.assinatura" emitido pela P.A.S (ferramentas/gerar_licenca.ps1): cliente, CNPJ, plano, computadores e validade,
   assinado com a chave privada de licença. Vale só para o CNPJ cadastrado em Empresa. Sem licença: 30 dias de avaliação.
   Vencida: aviso; passada a tolerância, modo consulta (consulta e backup funcionam; vendas e movimentações, não). */
const CHAVE_LICENCA = { kty: 'RSA', e: 'AQAB', n: 'qbet-0TUmPfrrp_GwlJxr0y21dI-potwikhBg5Yv80RkGVWjGGu0tDAbB5uqM5UOa12CeBrZcxlJ_Y1-0ikcsDR_kIgEW2S-B2cjsSffD3RwoRinf1Xf1QInKeqYnSAMMpuvoAwoAMG2LXZ-fpMwAWQ--18msZycFDNi7l_rxlBbutkrygxElabD-7PvTlek8Fkx-l8Jdq60gGRMk2gNjc9yy7KppSsl1mtGgpN5eBF-hFNor1dnBjLIYDjLF3urKRKpWyhABNdGddLaECjXqrDyX_UAsPUjE5TL1nuTwOdUS5vl7yLGt4FhOCW2Pg7mRHBBDrqr4ipQ9cFTrzm0HQAr_qB8sxhu6IirMn26ZjUWalNdvr_Yy3huAxO6P1oWuB6eCrye13hCZBHUPaKGM2Vq6hspxuo8PxAvAIXqpk04NAr9OnWomcur0qxzwdDfYra26XJOJF291pjjhZgvN8PEiESgvqSVbsB_NsCa9lGFFRiHOcc3kpUrc0exH5q9' };

let licInfo = null;
const b64uBytes = s => Uint8Array.from(atob(String(s).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const difDias = (a, b) => Math.round((Date.parse(a) - Date.parse(b)) / 864e5);
const somaDiasDe = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
async function lerLicenca(codigo) {
  const m = String(codigo || '').replace(/[^A-Za-z0-9_.-]/g, '').match(/^PAS1-([A-Za-z0-9_-]+)[.]([A-Za-z0-9_-]+)$/);
  if (!m) throw new Error('código de licença inválido (confira se copiou o código inteiro)');
  const dados = b64uBytes(m[1]), ass = b64uBytes(m[2]);
  const k = await crypto.subtle.importKey('jwk', CHAVE_LICENCA, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['verify']);
  if (!(await crypto.subtle.verify('RSASSA-PKCS1-v1_5', k, ass, dados))) throw new Error('assinatura inválida: este código não foi emitido pela P.A.S ou foi alterado');
  return JSON.parse(new TextDecoder().decode(dados));
}
// situação: ok | vencendo | tolerancia | bloqueada | avaliacao
async function conferirLicenca() {

    try { l = await lerLicenca(c.licenca); if (soDig(l.cnpj) !== soDig(c.cnpj)) { erro = `a licença é do CNPJ/CPF ${l.cnpj} e o cadastrado em Empresa é ${soDig(c.cnpj) || '(vazio)'}`; l = null; } }
    catch (e) { erro = e.message; }
  }

    licInfo = { l, resta, fimTol: somaDiasDe(l.validade, tol), sit: resta < -tol ? 'bloqueada' : resta < 0 ? 'tolerancia' : resta <= DIAS_AVISO_LIC ? 'vencendo' : 'ok' };
  } else {
    if (!c.licencaInicio) { c.licencaInicio = h; salvar(); }
    const ini = sl && sl.inicio ? sl.inicio : c.licencaInicio, resta = DIAS_AVALIACAO - difDias(h, ini);
    licInfo = { l: null, erro, resta, fimTol: somaDiasDe(ini, DIAS_AVALIACAO), sit: resta >= 0 ? 'avaliacao' : 'bloqueada' };
  }

}

/* ===== Tipos de peça e grades de tamanho (Configurações → Vendas e estoque) =====

   de moda masculina. TIPOS, TAMANHOS e PREFIXO são preenchidos aqui e usados no cadastro, filtros, relatórios e importações. */
const G_LETRAS = 'PP, P, M, G, GG, XG, XGG, XXG', G_NUM = '36, 38, 40, 42, 44, 46, 48, 50', G_FEM = '34, 36, 38, 40, 42, 44, 46',

  'Moda masculina (mais peças)': [['Camisa social', 'CSO', '1, 2, 3, 4, 5, 6'], ['Jaqueta', 'JAQ', G_LETRAS], ['Moletom', 'MOL', G_LETRAS], ['Short', 'SHO', G_LETRAS], ['Cueca', 'CUE', G_LETRAS], ['Sapato', 'SAP', G_CALC], ['Tênis', 'TEN', G_CALC]],
  'Moda feminina': [['Blusa', 'BLU', G_LETRAS], ['Vestido', 'VES', G_LETRAS], ['Saia', 'SAI', G_FEM], ['Short feminino', 'SHF', G_FEM], ['Calça feminina', 'CFE', G_FEM], ['Macacão', 'MAC', G_LETRAS], ['Cropped', 'CRO', G_LETRAS]],
  'Moda infantil': [['Body', 'BOD', G_BEBE], ['Conjunto infantil', 'CJI', G_INF], ['Camiseta infantil', 'CTI', G_INF], ['Bermuda infantil', 'BEI', G_INF], ['Vestido infantil', 'VEI', G_INF]],
  'Acessórios': [['Cinto', 'CIN', 'P, M, G'], ['Boné', 'BON', G_UNICO], ['Meia', 'MEI', G_UNICO], ['Carteira', 'CAR', G_UNICO], ['Perfume', 'PER', G_UNICO], ['Óculos', 'OCU', G_UNICO]]

const prefixoAuto = n => semAcento(n).replace(/[^a-z]/g, '').slice(0, 3).toUpperCase() || 'PRD';

function conferirTipos(l) {

  const l = lerTiposTela(), tem = new Set(l.map(t => semAcento(t.nome)));

function salvarTiposDaTela() {

/* ===== Caixa: abertura, sangria, suprimento e fechamento =====
   O caixa guarda o período (abertura → fechamento). O esperado de cada forma é calculado pelas vendas, recebimentos de
   títulos, devoluções em dinheiro, contas pagas em dinheiro, sangrias e suprimentos desse período. No fechamento, a pessoa
   informa o que contou e o sistema registra a diferença. Opcional: exigir caixa aberto para vender e fechamento cego. */
const FORMAS_CAIXA = ['Dinheiro', 'Pix', 'Cartão de débito', 'Cartão de crédito'];
const caixaAberto = () => (db.caixas || []).find(c => !c.fechamento);
const noCaixa = (ts, c) => !!ts && ts >= c.abertura.em && (!c.fechamento || ts <= c.fechamento.em);
function resumoCaixa(c) {
  const r = { vendas: {}, receb: {}, outras: {}, devol: 0, pagas: 0, sangria: 0, suprimento: 0, nVendas: 0, total: 0 };
  FORMAS_CAIXA.forEach(f => { r.vendas[f] = 0; r.receb[f] = 0; });

/* ===== Histórico de logs do sistema =====
   Tudo o que cada pessoa faz fica gravado num banco separado (lojaRoupasLog): entradas no sistema, vendas, estoque,
   financeiro, configurações, impressões, PDFs, WhatsApp, exportações e telas abertas. */
let filaLog = [], gravandoLog = false, logsCache = null, logLimite = 300;
function idbLog() {
  return new Promise((ok, er) => { const r = indexedDB.open('lojaRoupasLog', 1); r.onupgradeneeded = () => r.result.createObjectStore('log', { keyPath: 'id', autoIncrement: true }); r.onsuccess = () => ok(r.result); r.onerror = () => er(r.error); });
}
async function logOp(modo, fn) {
  const b = await idbLog();
  return new Promise((ok, er) => { const t = b.transaction('log', modo), st = t.objectStore('log'); let res; const r = fn(st); if (r) r.onsuccess = () => { res = r.result; }; t.oncomplete = () => { b.close(); ok(res); }; t.onerror = () => { b.close(); er(t.error); }; });
}
const logTodos = () => MODO_SERVIDOR ? api('logs') : logOp('readonly', st => st.getAll());
async function descarregarLog() {
  if (gravandoLog) return; gravandoLog = true;
  try {
    while (filaLog.length) {
      const l = filaLog.splice(0);
      if (MODO_SERVIDOR) { try { await apiJson('logs', 'POST', l); } catch (e) { filaLog.unshift(...l); setTimeout(descarregarLog, 10000); throw e; } }
      else await logOp('readwrite', st => { l.forEach(r => st.add(r)); });

}
function gravarLog(cat, ev, det, quem) {
  filaLog.push({ ts: Date.now(), q: agora(), u: quem || (eu ? eu.nome : '—'), login: eu ? eu.login : '', perfil: eu ? nomePerfil(eu.perfil) : '', cat, ev, det: det || '', tela: eu ? nomeNav(chaveNav()) : 'Tela de entrada' });

    if (c.valor > 0 && /^Estorno – venda nº .* cancelada$/.test(c.ref || '')) {   // venda cancelada: o crédito volta para os mesmos lotes, com a validade deles

        if (x.l.validade && x.l.validade + 'T23:59:59' < String(c.data)) x.l.vencido = r2((x.l.vencido || 0) + u); else x.l.resto = r2(x.l.resto + u);

let manualBusca = '';
function suporte() {
  if (!master()) return '<p class="vazio">Somente o usuário master acessa o manual do suporte.</p>';
  const q = semAcento(manualBusca.trim()).split(' ').filter(Boolean);
  const vis = MANUAL.filter(s => !q.length || q.every(w => semAcento(s.t + ' ' + s.h.replace(/<[^>]+>/g, ' ')).indexOf(w) >= 0));
  return `<h2>Manual do suporte <span class="tag in">só master</span></h2>
  <section class="card"><div class="filtros"><label class="lg">Buscar no manual<input id="mn-busca" value="${esc(manualBusca)}" placeholder="Ex.: licença, backup, PIN, celular, caixa…" autocomplete="off"></label><span style="flex:1"></span><button class="btn" data-act="manualAbrirTudo">Abrir tudo</button><button class="btn" data-act="manualPdf">Imprimir / PDF</button></div>
    <div class="mn-indice">${MANUAL.map((s, i) => `<button class="lnk" data-act="manualIr" data-v="${s.id}">${i + 1}. ${esc(s.t)}</button>`).join('')}</div>
    <p class="mut" style="margin:6px 0 0">Prints de uma loja de demonstração (dados fictícios). Eles são baixados da nuvem ao abrir cada seção; sem internet aparece só o texto.</p></section>
  ${vis.length ? vis.map(s => `<details class="aj-item mn-sec" id="mn-${s.id}"${q.length ? ' open' : ''}><summary><span class="aj-n">${MANUAL.indexOf(s) + 1}</span>${esc(s.t)}</summary><div class="mn-corpo">${s.h}</div></details>`).join('') : '<p class="vazio">Nada encontrado no manual.</p>'}`;
}
const printsCache = {};
async function carregarPrints(raiz) {
  for (const d of raiz.querySelectorAll('.mn-img[data-print]:not(.ok)')) {
    const k = d.dataset.print; d.classList.add('ok');
    try {
      if (!printsCache[k]) { const r = await fetch(MANUAL_PRINTS + k + '.jpg', { cache: 'force-cache' }); if (!r.ok) throw new Error(r.status); printsCache[k] = URL.createObjectURL(await r.blob()); }
      d.innerHTML = `<img src="${printsCache[k]}" alt="" data-act="manualZoom">`;
    } catch (e) { d.innerHTML = '<span>Print disponível com internet.</span>'; }
  }
}
document.addEventListener('toggle', e => { if (e.target && e.target.classList && e.target.classList.contains('mn-sec') && e.target.open) carregarPrints(e.target); }, true);
document.addEventListener('input', e => { if (e.target && e.target.id === 'mn-busca') { manualBusca = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#mn-busca'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } } });
ACT.manualIr = el => { const d = $('#mn-' + el.dataset.v); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } };
ACT.manualAbrirTudo = () => $$('.mn-sec').forEach(d => { d.open = true; });
ACT.manualZoom = el => abrirModal('Print', `<img src="${el.src}" alt="" style="width:100%;border-radius:8px">`, '', true);
ACT.manualPdf = async () => {

/* ===== Backup na nuvem (Google Drive ou OneDrive) =====
   O aplicativo do Drive/OneDrive instalado no computador sincroniza uma pasta com a nuvem. O sistema cria nessa pasta
   "Controle de Estoque - <loja>/Backups" e o backup diário (criptografado) é gravado lá; o aplicativo envia sozinho.
   Nenhuma senha do Google/Microsoft é guardada no sistema. Só arquivos criptografados vão para a nuvem. */
let nuvemAchadas = null;
const nuvemInfo = () => (srvInfo && srvInfo.nuvem) || { ativo: false };
function nuvemAtrasada() {
  const n = nuvemInfo(); if (!n.ativo) return '';
  if (!n.acessivel) return 'a pasta do ' + (n.prov === 'onedrive' ? 'OneDrive' : 'Google Drive') + ' não está acessível neste computador (aplicativo fechado ou desconectado)';
  if (!n.ultimo) return 'nenhum backup foi enviado ainda';
  const dias = Math.floor((Date.now() - Date.parse(n.ultimo)) / 864e5);
  return dias >= 2 ? `o último backup enviado foi há ${dias} dias` : '';
}
function secaoNuvem() {
  if (!MODO_SERVIDOR || MODO_REDE) return '';
  const n = nuvemInfo(), cr = criptoBk(), prob = nuvemAtrasada(), nomeP = p => p === 'onedrive' ? 'OneDrive' : 'Google Drive';
  return `<section class="card"><div class="cfg-cab"><h3>Backup na nuvem ${n.ativo ? `<span class="tag ${prob ? 'bx' : 'ok'}">${prob ? 'atenção' : 'ligado'}</span>` : '<span class="tag in">desligado</span>'}</h3>
    <p class="mut">Uma cópia criptografada do backup vai todo dia para o Google Drive ou o OneDrive da loja. Se o computador quebrar ou for roubado, os dados continuam salvos.</p></div>
    ${n.ativo ? `<div class="resumo-tit"><div class="rbox ${prob ? 'at' : 'ok'}"><small>${nomeP(n.prov)}</small><b style="font-size:14px">${esc(n.email || '—')}</b><span>${esc(n.pasta)}</span></div>
      <div class="rbox"><small>Último envio</small><b>${n.ultimo ? fmtDH(n.ultimo) : '—'}</b><span>${n.arquivos || 0} arquivo(s) na nuvem</span></div></div>
      ${prob ? `<p class="err">Atenção: ${esc(prob)}. Abra o aplicativo do ${nomeP(n.prov)} e confira se está conectado com ${esc(n.email || 'o e-mail da loja')}.</p>` : ''}
      <div class="acoes" style="justify-content:flex-start"><button class="btn" data-act="backupAgora">Enviar backup agora</button><button class="btn perigo" data-act="nuvemDesligar">Desligar backup na nuvem</button></div>`
    : `${cr.ativo ? '' : '<p class="err">Antes, ligue a <b>criptografia do backup</b> em Configurações → Segurança: só arquivos criptografados vão para a nuvem.</p>'}
      <ol class="mn-passos"><li>Neste computador, instale o <b>Google Drive para computador</b> (ou use o OneDrive do Windows) e entre com o e-mail da loja.</li>
      <li>Escolha abaixo o serviço, digite o e-mail e clique em <b>Procurar a pasta</b>.</li><li>Escolha a pasta encontrada e clique em <b>Ligar backup na nuvem</b>: o sistema cria a pasta <b>Controle de Estoque - ${esc(db.config.loja || 'Loja')}/Backups</b>.</li></ol>
      <div class="form3"><label>Serviço<select id="nv-prov"><option value="google">Google Drive</option><option value="onedrive">OneDrive</option></select></label>
        <label>E-mail da conta<input id="nv-email" type="email" placeholder="loja@gmail.com" value="${esc(n.email || '')}"></label>
        <button class="btn" data-act="nuvemProcurar">Procurar a pasta</button></div>
      <div id="nv-achadas">${nuvemAchadas ? (nuvemAchadas.length ? nuvemAchadas.map((a, i) => `<label class="chk"><input type="radio" name="nv-pasta" value="${i}" ${i === 0 ? 'checked' : ''}> <b>${esc(a.pasta)}</b>${a.conta ? ` <span class="mut">(${esc(a.conta)})</span>` : ''}${a.confere ? ' <span class="tag ok">e-mail confere</span>' : ''}</label>`).join('') + `<div class="acoes" style="justify-content:flex-start"><button class="btn pri" data-act="nuvemLigar" ${cr.ativo ? '' : 'disabled'}>Ligar backup na nuvem</button></div>` : '<p class="err">Nenhuma pasta do serviço encontrada neste computador. Instale o aplicativo, entre com o e-mail e tente de novo.</p>') : ''}</div>`}
    <p class="mut">Para o backup ir todo dia, deixe o <b>Backup automático</b> ligado (acima). A senha do backup é necessária para restaurar: guarde-a fora do computador.</p></section>`;
}
ACT.nuvemProcurar = async () => {
  const prov = $('#nv-prov').value, email = $('#nv-email').value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return aviso('Digite o e-mail da conta do ' + (prov === 'onedrive' ? 'OneDrive' : 'Google Drive') + '.', 'erro');
  try { const r = await apiJson('nuvem/detectar', 'POST', { prov, email }); nuvemAchadas = (r.pastas || []).map(a => Object.assign(a, { prov, email })); }
  catch (e) { return aviso('Não foi possível procurar: ' + e.message, 'erro'); }
  render(); setTimeout(() => { if ($('#nv-prov')) { $('#nv-prov').value = prov; $('#nv-email').value = email; } });
};
ACT.nuvemLigar = async () => {
  if (!adm()) return; if (!criptoBk().ativo) return aviso('Ligue a criptografia do backup antes (Configurações → Segurança).', 'erro');
  const i = +(($$('input[name=nv-pasta]').find(r => r.checked) || {}).value || 0), a = (nuvemAchadas || [])[i]; if (!a) return;
  try {
    await apiJson('nuvem', 'POST', { prov: a.prov, email: a.email, raiz: a.pasta }); await atualizarSrvInfo();
    const b = cfgBk(); if (!b.ativo) { b.ativo = true; b.freq = b.freq || 'diario'; db.config.backupAuto = b; }
    registrar('Backup na nuvem ligado', `${a.prov === 'onedrive' ? 'OneDrive' : 'Google Drive'} ${a.email}: ${a.pasta}`); salvar(); nuvemAchadas = null;
    await rodarBackup('nuvem'); await atualizarSrvInfo(); render();
    aviso('Backup na nuvem ligado. O primeiro backup já foi enviado para a pasta do Drive.', 'ok');
  } catch (e) { aviso('Não foi possível ligar: ' + e.message, 'erro'); }
};
ACT.nuvemDesligar = async () => {
  if (!adm()) return;
  try { await apiJson('nuvem', 'POST', { desligar: true }); await atualizarSrvInfo(); registrar('Backup na nuvem desligado'); salvar(); render(); aviso('Backup na nuvem desligado. Os arquivos que já estão no Drive continuam lá.', 'ok'); }
  catch (e) { aviso(e.message, 'erro'); }
};
